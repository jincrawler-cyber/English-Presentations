<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Events Timeline</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align items to the start of the cross axis */
            min-height: 100vh; /* Ensure it takes full viewport height */
            padding: 2rem 1rem; /* Add some padding around the content */
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }
        .timeline-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 0;
        }

        /* Timeline line for larger screens */
        .timeline-container::after {
            content: '';
            position: absolute;
            width: 6px;
            background-color: #a78bfa; /* Purple line */
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -3px;
            @media (max-width: 768px) {
                left: 1rem; /* Adjust for mobile, line on left */
            }
        }

        .timeline-card {
            padding: 10px 40px;
            position: relative;
            background-color: inherit;
            width: 50%;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .timeline-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* Adjustments for left/right alignment */
        .left {
            left: 0;
            padding-right: 90px; /* Space for the circle */
            @media (max-width: 768px) {
                padding-right: 10px;
                padding-left: 50px; /* Space for the circle on mobile */
                width: 100%;
            }
        }

        .right {
            left: 50%;
            padding-left: 90px; /* Space for the circle */
            @media (max-width: 768px) {
                left: 0;
                padding-right: 10px;
                padding-left: 50px; /* Space for the circle on mobile */
                width: 100%;
            }
        }

        /* Circle on the timeline line */
        .timeline-card::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #8b5cf6; /* Darker purple circle */
            border: 4px solid #ede9fe; /* Light purple border */
            top: 15px;
            border-radius: 50%;
            z-index: 1;
        }

        .left::after {
            right: -12.5px;
            @media (max-width: 768px) {
                left: 0.5rem; /* Adjust for mobile */
                right: auto;
            }
        }

        .right::after {
            left: -12.5px;
            @media (max-width: 768px) {
                left: 0.5rem; /* Adjust for mobile */
                right: auto;
            }
        }

        /* Content box within the card */
        .card-content {
            background-color: #ffffff;
            border-radius: 0.75rem; /* Rounded corners */
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* Arrow pointing to the timeline line */
        .left .card-content::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 22px;
            width: 0;
            z-index: 1;
            right: -15px;
            border: medium solid white;
            border-width: 10px 0 10px 10px;
            border-color: transparent transparent transparent white;
            @media (max-width: 768px) {
                left: 40px; /* Adjust for mobile */
                border-width: 10px 10px 0 10px;
                border-color: white transparent transparent transparent;
                top: -10px;
                right: auto;
            }
        }

        .right .card-content::before {
            content: " ";
            height: 0;
            position: absolute;
            top: 22px;
            width: 0;
            z-index: 1;
            left: -15px;
            border: medium solid white;
            border-width: 10px 10px 10px 0;
            border-color: transparent white transparent transparent;
            @media (max-width: 768px) {
                left: 40px; /* Adjust for mobile */
                border-width: 10px 10px 0 10px;
                border-color: white transparent transparent transparent;
                top: -10px;
                right: auto;
            }
        }

        /* Responsive timeline */
        @media (max-width: 768px) {
            .timeline-container::after {
                left: 1rem;
            }
            .timeline-card {
                width: 100%;
                padding-left: 50px;
                padding-right: 10px;
            }
            .timeline-card.right {
                left: 0%;
            }
        }
    </style>
</head>
<body>
    <div class="timeline-container w-full">
        <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-800 mb-12">Life Events Timeline</h1>

        <!-- Timeline Item 1: Be Born -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.shutterstock.com/image-photo/newborn-baby-sleeps-sweetly-his-600nw-1754057072.jpg" alt="Baby" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Be Born</p>
            </div>
        </div>

        <!-- Timeline Item 2: Be Raised -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://focus.independent.ie/thumbor/_JvWlMcp5HHsBtkTyjmE_xVs6hk=/0x0:2120x1414/960x640/prod-mh-ireland/4d0a11c2-78b0-41f7-988b-09f8174db095/e349715f-4e15-4b94-84f3-a376f27062e2/4d0a11c2-78b0-41f7-988b-09f8174db095.jpg" alt="Childhood Home" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Be Raised</p>
            </div>
        </div>

        <!-- Timeline Item 3: Go to School -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://media.cnn.com/api/v1/images/stellar/prod/gettyimages-1466407372.jpg?q=w_1110,c_fill" alt="School" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Go to School</p>
            </div>
        </div>

        <!-- Timeline Item 4: Graduate -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://plus.unsplash.com/premium_photo-1713296255442-e9338f42aad8?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Z3JhZHVhdGV8ZW58MHx8MHx8fDA%3D" alt="Graduation" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Graduate</p>
            </div>
        </div>

        <!-- Timeline Item 5: Get a First Job -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.workitdaily.com/media-library/young-professional-shakes-hands-with-the-hiring-manager-after-accepting-his-first-job-offer-at-the-end-of-an-interview.jpg?id=20504982&width=800&quality=85" alt="First Job" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Get a First Job</p>
            </div>
        </div>

        <!-- Timeline Item 6: Live Alone -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://prod-cdn.storespace.com/images/default-source/blogpostsimages/man-window-living-alone-for-the-first-time.jpg?sfvrsn=bf524830_0" alt="Living Alone" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Live Alone</p>
            </div>
        </div>

        <!-- Timeline Item 7: Live with My Family -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://dazzlinginsights.com/wp-content/uploads/2021/02/dazzling-insights-benefits-of-a-family-being-together.png" alt="Living with Family" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Live with My Family</p>
            </div>
        </div>

        <!-- Timeline Item 8: Be into Someone/Something -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://miun.imagevault.media/publishedmedia/9w116any7qy47lknat4e/816456-attractive-young-couple.webp" alt="Interests" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Be Into Someone/Something</p>
            </div>
        </div>

        <!-- Timeline Item 9: Be Single -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://images.squarespace-cdn.com/content/v1/5437f300e4b01983f004f8c4/1495121118099-VK6QYKX7RHDJA8NH4YXU/image-asset.jpeg" alt="Single Person" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Be Single</p>
            </div>
        </div>

        <!-- Timeline Item 10: Get Engaged -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.brilliance.com/cdn-cgi/image/f=webp,width=1440,height=1440,quality=90/sites/default/files/vue/collections/engagement-rings-diamond_og.jpg" alt="Engagement Ring" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Get Engaged</p>
            </div>
        </div>

        <!-- Timeline Item 11: Be Married -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://smartasset.com/wp-content/uploads/sites/2/2024/07/newlyweds-are-greeted-with-festive-confetti-joyful-bride-and-groom-celebrating-their-wedding.jpg_s1024x1024wisk20csizPlqe0gnSNdNVs8K498TaebqSasAQ7oX5lELGO73s.jpg" alt="Married Couple" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Be Married</p>
            </div>
        </div>

        <!-- Timeline Item 12: Have Children -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://scx2.b-cdn.net/gfx/news/2019/doeshavingki.jpg" alt="Family with Child" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Have Children</p>
            </div>
        </div>

        <!-- Timeline Item 13: Buy a House -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.bankrate.com/2022/12/12171624/requirements-to-buy-a-house.jpg?auto=webp&optimize=high&crop=16:9" alt="House" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Buy a House</p>
            </div>
        </div>

        <!-- Timeline Item 14: Travel the World -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.eaglecreek.com/cdn/shop/articles/how_2Dtravel_2Daround_2Dworld_2D1439398394.jpg?v=1641396364" alt="Globe and Plane" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Travel the World</p>
            </div>
        </div>

        <!-- Timeline Item 15: Celebrate -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://fullfocus.co/wp-content/uploads/2017/11/celebration-1920-1200x800.jpg" alt="Celebration" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Celebrate</p>
            </div>
        </div>

        <!-- Timeline Item 16: Retire -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://image.sciencenorway.no/1460005.webp?imageId=1460005&width=960&height=548&format=jpg" alt="Retirement" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Retire</p>
            </div>
        </div>

        <!-- Timeline Item 17: Become a Grandparent -->
        <div class="timeline-card left">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://www.theheritagelcs.com/wp-content/uploads/unnamed-132-1024x682.jpg" alt="Grandparents" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Become a Grandparent</p>
            </div>
        </div>

        <!-- Timeline Item 18: Pass Away -->
        <div class="timeline-card right">
            <div class="card-content flex flex-col items-center p-6 rounded-xl shadow-lg">
                <img src="https://willwritten.com/content/200/what_to_do_when_a_loved_one_dies__600.jpg" alt="Dove" class="rounded-lg mb-4 w-32 h-32 object-cover">
                <p class="text-xl font-semibold text-gray-700">Pass Away</p>
            </div>
        </div>

    </div>
</body>
</html>
