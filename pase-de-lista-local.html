<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pase de Lista Inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one working column under a sticky bar with three tabs; the roll call reads like a paper sheet — numbered rows, one mark per student (A · R · F · J). */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#14202c; --muted:#5a6876; --line:#d6dde4;
  --accent:#1c5ab8; --accent-ink:#ffffff; --accent-soft:#e2ebf8;
  --ok:#17784a; --ok-soft:#dcf2e5; --late:#9a6200; --late-soft:#f9edd2;
  --abs:#bb3328; --abs-soft:#fae1de; --just:#6646b0; --just-soft:#ebe5f8;
  --f-display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#1c2733; --ink:#e6edf3; --muted:#97a6b5; --line:#2b3947;
  --accent:#6aa1f0; --accent-ink:#0b1a2e; --accent-soft:#1d304a;
  --ok:#5bcf90; --ok-soft:#173a29; --late:#e9b34f; --late-soft:#3d2f12;
  --abs:#f07f74; --abs-soft:#432019; --just:#b49cf0; --just-soft:#2d2546; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#1c2733; --ink:#e6edf3; --muted:#97a6b5; --line:#2b3947;
  --accent:#6aa1f0; --accent-ink:#0b1a2e; --accent-soft:#1d304a;
  --ok:#5bcf90; --ok-soft:#173a29; --late:#e9b34f; --late-soft:#3d2f12;
  --abs:#f07f74; --abs-soft:#432019; --just:#b49cf0; --just-soft:#2d2546; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .mark{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:13px}
nav.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-display);padding:6px 12px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding-block:20px 120px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.notice.warn{background:var(--late-soft)}
.notice.err{background:var(--abs-soft)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--abs);border-color:var(--abs)}
.btn.danger.armed{background:var(--abs);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.field{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-height:38px}
textarea{min-height:180px;resize:vertical;line-height:1.5}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* group chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .tag{font:600 11px var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .tag{color:inherit;opacity:.8}

/* sheet */
.sheet-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.A{background:var(--ok-soft);color:var(--ok)} .pill.R{background:var(--late-soft);color:var(--late)}
.pill.F{background:var(--abs-soft);color:var(--abs)} .pill.J{background:var(--just-soft);color:var(--just)}
.pill.N{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
ol.sheet{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
ol.sheet li{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--line)}
ol.sheet li:first-child{border-top:0}
ol.sheet li.st-A{box-shadow:inset 3px 0 var(--ok)} ol.sheet li.st-R{box-shadow:inset 3px 0 var(--late)}
ol.sheet li.st-F{box-shadow:inset 3px 0 var(--abs)} ol.sheet li.st-J{box-shadow:inset 3px 0 var(--just)}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:22px;flex:none;text-align:right}
.sname{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.marks{display:flex;gap:4px;flex:none}
.mat{display:block;font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mk{width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:700 15px var(--f-display);color:var(--muted);cursor:pointer}
.mk:hover{background:var(--surface-2)}
.mk[aria-pressed="true"].A{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mk[aria-pressed="true"].R{background:var(--late);border-color:var(--late);color:var(--surface)}
.mk[aria-pressed="true"].F{background:var(--abs);border-color:var(--abs);color:var(--surface)}
.mk[aria-pressed="true"].J{background:var(--just);border-color:var(--just);color:var(--surface)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{font-family:var(--f-display)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:12px;align-items:center;padding-block:10px;flex-wrap:wrap}
.savebar .status{margin-right:auto;font-size:13px;color:var(--muted);min-width:0}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.savebar .status.dirty{color:var(--late);font-weight:700}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.hist button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}

/* groups */
.glist{display:grid;gap:10px}
.gcard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.gcard .meta{min-width:0}
.gcard .actions{display:flex;gap:6px}
.prog{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}

/* coordination */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .v{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.tile .v.bad{color:var(--abs)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.bar-pct{display:inline-flex;align-items:center;gap:8px}
.bar-pct i{display:block;width:70px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar-pct i b{display:block;height:100%;background:var(--ok)}
.bar-pct.low i b{background:var(--abs)} .bar-pct.mid i b{background:var(--late)}
.matrix td.c{text-align:center;font:700 13px var(--f-display);padding:6px 4px;min-width:30px}
.matrix th.d{text-align:center;padding:6px 4px;font-size:10px}
.matrix td.c.A{color:var(--ok)} .matrix td.c.R{color:var(--late);background:var(--late-soft)}
.matrix td.c.F{color:var(--abs);background:var(--abs-soft)} .matrix td.c.J{color:var(--just);background:var(--just-soft)}
.matrix td.sticky,.matrix th.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.matrix thead th.sticky{background:var(--surface-2)}
.empty{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
.empty .big{font:700 40px var(--f-display);color:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:700;z-index:20;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:460px){.mk{width:36px}.marks{gap:3px}.num{display:none}h1{font-size:21px}}
@media (prefers-reduced-motion:no-preference){.mk,.chip,.btn{transition:background .12s,color .12s,border-color .12s}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true">✓</span>Pase de Lista</div>
    <nav class="tabs" id="tabs" aria-label="Secciones">
      <button type="button" data-act="tab" data-view="lista" id="tab-lista">Pasar lista</button>
      <button type="button" data-act="tab" data-view="grupos" id="tab-grupos">Grupos</button>
      <button type="button" data-act="tab" data-view="coordinacion" id="tab-coord" hidden>Coordinación</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view">
  <div class="panel empty">
    <div class="big">A · R · F · J</div>
    <h2>Cargando grupos…</h2>
    <p class="muted small">Aquí aparecerán tus grupos para pasar lista.</p>
  </div>
</main>
<div class="savebar" id="savebar" hidden>
  <div class="wrap">
    <div class="status" id="savestatus"></div>
    <button type="button" class="btn" data-act="discard" id="btn-discard" hidden>Descartar</button>
    <button type="button" class="btn primary" data-act="save" id="btn-save">Guardar lista</button>
    <button type="button" class="btn wa" data-act="wa" id="btn-wa" hidden>Enviar por WhatsApp</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================
   CONFIGURACIÓN
   Número de WhatsApp de coordinación, con código de país
   (52 para México) y sin espacios. Ej.: "524491234567"
   ========================================================= */
const WHATSAPP_COORDINACION = "524497547598";
/* Grupos iniciales (botón "Cargar grupos iniciales" cuando la base está vacía) */
const SEED = [{"id": "ejap18-ser-humano", "name": "Ser Humano · LIC-EJAP-18", "teacher": "Sonia Legaspi Aguirre", "schedule": "Sábado 8:00–9:30", "program": "UNID", "students": [{"id": "sfc7k2p9qa", "name": "Flores Cuevas, Carlos Daniel"}, {"id": "m00960101", "mat": "00960101", "name": "Tabares Rodriguez, Luis Emilio"}, {"id": "m00968055", "mat": "00968055", "name": "Cárdenas Luevanos, Óscar Guadalupe"}, {"id": "m00963453", "mat": "00963453", "name": "Vázquez Rodríguez, Maria Marlen"}, {"id": "m00961249", "mat": "00961249", "name": "Martínez Pedróza, Julio Cesar"}, {"id": "m00967865", "mat": "00967865", "name": "Gonzalez Regalado, Karol Analhi"}, {"id": "m00959063", "mat": "00959063", "name": "Macías Ramirez, Karen Yesenia"}, {"id": "m00959788", "mat": "00959788", "name": "García Luevanos, Maria"}, {"id": "m00960141", "mat": "00960141", "name": "Maciel Tejeda, Luis Humberto"}]}, {"id": "ejap18-estrategias", "name": "Estrategias para el Aprendizaje Autónomo · LIC-EJAP-18", "teacher": "César Alejandro Gómez Puerto", "schedule": "Sábado 10:00–11:30", "program": "UNID", "students": [{"id": "sfc7k2p9qa", "name": "Flores Cuevas, Carlos Daniel"}, {"id": "m00960101", "mat": "00960101", "name": "Tabares Rodriguez, Luis Emilio"}, {"id": "m00968055", "mat": "00968055", "name": "Cárdenas Luevanos, Óscar Guadalupe"}, {"id": "m00963453", "mat": "00963453", "name": "Vázquez Rodríguez, Maria Marlen"}, {"id": "m00961249", "mat": "00961249", "name": "Martínez Pedróza, Julio Cesar"}, {"id": "m00967865", "mat": "00967865", "name": "Gonzalez Regalado, Karol Analhi"}, {"id": "m00959063", "mat": "00959063", "name": "Macías Ramirez, Karen Yesenia"}, {"id": "m00959788", "mat": "00959788", "name": "García Luevanos, Maria"}, {"id": "m00960141", "mat": "00960141", "name": "Maciel Tejeda, Luis Humberto"}]}];
(function(){
const PROGRAMS = ["UNID","Adultos","Preteens","Kids","VOXY","Otro"];
const CODES = {A:"Asistió",R:"Retardo",F:"Falta",J:"Justificada"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO = () => iso(new Date());
const monthStart = () => { const d=new Date(); return iso(new Date(d.getFullYear(), d.getMonth(), 1)); };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmtDate = (s, opt) => parseISO(s).toLocaleDateString("es-MX", opt || {weekday:"short",day:"numeric",month:"short"});
const fmtTime = s => { try{ return new Date(s).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const rid = () => "s" + Math.random().toString(36).slice(2,10);
const attKey = (gid,date) => gid + "_" + date;
const tc = s => s.toLocaleLowerCase("es").replace(/(^|[\s\-'])(\p{L})/gu,(m,a,b)=>a+b.toLocaleUpperCase("es")).replace(/ (De|Del|La|Las|Los|Y)(?= )/g, m=>m.toLowerCase());
/* Accepts Banner rows (matrícula ⇥ Apellido*Apellido,Nombre ⇥ campus ⇥ programa) or a plain name per line */
function parseStudent(line){
  let parts=String(line).split("\t").map(s=>s.trim()).filter(Boolean);
  if(parts.length===1){ const m=parts[0].match(/^(\d{6,10})\s+(.+)$/); if(m) parts=[m[1],m[2]]; }
  let mat=null, raw=null;
  for(const p of parts){ if(!mat && /^\d{6,10}$/.test(p)) mat=p; else if(!raw && /\p{L}/u.test(p)) raw=p; }
  if(!raw) return null;
  raw=raw.replace(/\s+/g," ");
  let name=raw;
  if(raw.includes("*")||raw.includes(",")){
    const i=raw.indexOf(",");
    const ap=(i<0?raw:raw.slice(0,i)).split("*").map(s=>s.trim()).filter(Boolean).join(" ");
    const nom=i<0?"":raw.slice(i+1).trim();
    name=tc(ap)+(nom?", "+tc(nom):"");
  }
  return {mat,name};
}
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

const S = {
  db:null, user:null, downloads:null, offline:false, err:null,
  isCoord:false, readOnly:false, myId:null,
  groups:[], groupsReady:false, att:new Map(), attReady:false,
  view: "lista", gid: store.get("pl.gid"), date: todayISO(),
  draft:{}, dirty:false, remoteNote:false, saving:false,
  form:null, delArm:null,
  rep:{program:"", gid:"", from:monthStart(), to:todayISO(), risk:3},
  names:{}
};
const h = (location.hash||"").slice(1);
if (["lista","grupos","coordinacion"].includes(h)) S.view = h;

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>{t.hidden=true;},2200);
}

/* ---------- names (who took the list) ---------- */
async function refreshNames(){
  if(!S.user) return;
  const ids = new Set();
  S.att.forEach(a=>{ if(a.takenBy) ids.add(a.takenBy); });
  if(!ids.size) return;
  try{
    const ps = await S.user.profiles([...ids]);
    let changed=false;
    for(const id in ps){ const n = ps[id].name || ""; if(S.names[id]!==n){ S.names[id]=n; changed=true; } }
    if(changed) render(false);
  }catch(e){}
}
const who = v => v || "el maestro";

/* ---------- helpers ---------- */
const currentGroup = () => S.groups.find(g=>g.id===S.gid) || S.groups[0] || null;
function counts(marks, students){
  const c={A:0,R:0,F:0,J:0,N:0};
  (students||[]).forEach(s=>{ const m=marks&&marks[s.id]; if(m&&c[m]!==undefined) c[m]++; else c.N++; });
  return c;
}
const pct = c => { const d=c.A+c.R+c.F; return d? Math.round((c.A+c.R)*100/d) : null; };
function pctBar(p){
  if(p===null) return '<span class="muted">—</span>';
  const cls = p<80?"low":p<90?"mid":"";
  return `<span class="bar-pct ${cls}"><i><b style="width:${p}%"></b></i>${p}%</span>`;
}

/* ---------- render ---------- */
function setTabs(){
  document.querySelectorAll("#tabs button").forEach(b=>{
    if(b.dataset.view===S.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
}
function render(full=true){
  setTabs();
  if(S.offline){
    $("#view").innerHTML = `<div class="notice warn">${esc(S.err||"Este navegador no permite guardar datos. Abre la app en Chrome o Safari (no en modo incógnito).")}</div>`;
    $("#savebar").hidden = true; return;
  }
  if(!S.groupsReady){ $("#savebar").hidden = true; return; }
  if(S.view==="lista") renderLista();
  else if(S.view==="grupos") renderGrupos(full);
  else if(S.isCoord) renderCoord(); else renderPin();
}

function errBanner(){ return S.err ? `<div class="notice err">${esc(S.err)}</div>` : ""; }
function roBanner(){ return S.readOnly ? `<div class="notice warn">Tu acceso a esta página es de solo lectura. Pide a coordinación el permiso «Puede editar» para guardar listas.</div>` : ""; }

function renderLista(){
  const v=$("#view");
  if(!S.groups.length){
    v.innerHTML = errBanner()+`<div class="panel empty">
      <div class="big">A · R · F · J</div>
      <h2>Todavía no hay grupos</h2>
      <p class="muted small">Crea tu primer grupo con la lista de alumnos y aquí podrás pasar lista cada clase.</p>

  <section class="tiles">
    <div class="tile"><span class="eyebrow">Asistencia</span><span class="v ${p!==null&&p<80?"bad":""}">${p===null?"—":p+"%"}</span><span class="muted small">Retardo cuenta como asistencia; justificada no cuenta</span></div>
    <div class="tile"><span class="eyebrow">Listas registradas</span><span class="v">${sessions}</span><span class="muted small">${esc(fmtDate(r.from,{day:"numeric",month:"short"}))} – ${esc(fmtDate(r.to,{day:"numeric",month:"short"}))}</span></div>
    <div class="tile"><span class="eyebrow">Alumnos en alerta</span><span class="v ${risk.length?"bad":""}">${risk.length}</span><span class="muted small">${r.risk} faltas o más</span></div>
    <div class="tile"><span class="eyebrow">Sin lista hoy</span><span class="v">${noToday}<span class="muted small" style="font-size:14px"> / ${rows.length}</span></span><span class="muted small">grupos del filtro</span></div>
  </section>
  ${rows.length?`<section style="display:grid;gap:8px"><h2>Por grupo</h2>

    <tbody>${rows.map(x=>`<tr class="click" data-act="repgroup" data-gid="${esc(x.g.id)}" tabindex="0">
      <td><b>${esc(x.g.name)}</b></td><td>${esc(x.g.program||"")}</td><td>${esc(x.g.teacher||"—")}</td>
      <td class="n">${x.docs.length}</td><td class="n">${x.gc.F}</td><td>${pctBar(pct(x.gc))}</td>
      <td>${x.last?`${esc(fmtDate(x.last.date))} <span class="muted small">· ${esc(who(x.last.takenBy))}</span>`:'<span class="muted">Sin listas</span>'}</td></tr>`).join("")}</tbody>

  <section style="display:grid;gap:8px"><h2>Alumnos en alerta</h2>
  ${risk.length?`<div class="tablewrap"><table>

/* ---------- WhatsApp ---------- */
function waOpen(text){
  const num=String(WHATSAPP_COORDINACION).replace(/\D/g,"");
  if(num.length<10){ toast("Falta configurar el número de WhatsApp de coordinación"); return; }
  const a=document.createElement("a"); a.href="https://wa.me/"+num+"?text="+encodeURIComponent(text);
  a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}
const fmtLong = d => fmtDate(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const sLabel = s => s.name + (s.mat?` (${s.mat})`:"");
function dayReport(g, a){
  const studs=g.students||[]; const c=counts(a.marks,studs); const p=pct(c);
  const by=k=>studs.filter(s=>(a.marks||{})[s.id]===k);
  const L=[`*Asistencia · ${g.name}*`, `${g.teacher?"Maestro(a): "+g.teacher+"\n":""}${fmtLong(a.date)}${g.schedule?" · "+g.schedule:""}`, "",
    `Asistieron: ${c.A}  |  Retardos: ${c.R}  |  Faltas: ${c.F}  |  Justificadas: ${c.J}${c.N?"  |  Sin marcar: "+c.N:""}`,
    `Asistencia: ${p===null?"—":p+"%"} (${studs.length} alumnos)`];
  [["F","Faltas"],["R","Retardos"],["J","Justificadas"]].forEach(([k,t])=>{ const l=by(k); if(l.length){ L.push("",`*${t}:*`); l.forEach(s=>L.push("- "+sLabel(s))); } });
  if(c.N){ L.push("","*Sin marcar:*"); studs.filter(s=>!(a.marks||{})[s.id]).forEach(s=>L.push("- "+sLabel(s))); }
  return L.join("\n");
}
function cumReport(g){
  const studs=g.students||[];
  const docs=[...S.att.values()].filter(a=>a.groupId===g.id).sort((x,y)=>x.date<y.date?-1:1);
  const tot={A:0,R:0,F:0,J:0};
  const rows=studs.map(s=>{ const c={A:0,R:0,F:0,J:0}; docs.forEach(a=>{ const m=(a.marks||{})[s.id]; if(m&&c[m]!==undefined){c[m]++; tot[m]++;} }); return {s,c}; });
  rows.sort((x,y)=>y.c.F-x.c.F||x.s.name.localeCompare(y.s.name,"es"));
  const L=[`*Asistencia acumulada · ${g.name}*`, `${g.teacher?"Maestro(a): "+g.teacher+"\n":""}${docs.length} ${docs.length===1?"clase registrada":"clases registradas"} (${fmtDate(docs[0].date,{day:"numeric",month:"short"})} – ${fmtDate(docs[docs.length-1].date,{day:"numeric",month:"short"})})`,
    `Asistencia del grupo: ${pct(tot)===null?"—":pct(tot)+"%"}`, "", "*Alumno — F / R / J — %*"];
  rows.forEach(({s,c})=>{ const p=pct(c); L.push(`${c.F>=3?"⚠️ ":""}${sLabel(s)} — ${c.F} / ${c.R} / ${c.J} — ${p===null?"—":p+"%"}`); });
  L.push("", "F = faltas, R = retardos, J = justificadas. ⚠️ = 3 faltas o más.");
  return L.join("\n");
}
/* ---------- actions ---------- */
function confirmLeave(){ if(S.dirty){ S.dirty=false; S.remoteNote=false; } }

document.addEventListener("click", async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act!=="delgroup" && S.delArm){ S.delArm=null; if(S.view==="grupos") renderGrupos(false); }
  if(act==="tab"){ S.view=b.dataset.view; try{ history.replaceState(null,"","#"+S.view); }catch(_){} render(); window.scrollTo(0,0); }
  else if(act==="pickgroup"){ confirmLeave(); S.gid=b.dataset.gid; store.set("pl.gid",S.gid); render(); }
  else if(act==="pickdate"){ confirmLeave(); S.date=b.dataset.date; render(); }
  else if(act==="mark"){ const sid=b.dataset.sid, k=b.dataset.code; if(S.draft[sid]===k) delete S.draft[sid]; else S.draft[sid]=k; S.dirty=true; renderLista(); }
  else if(act==="allA"){ (currentGroup().students||[]).forEach(s=>{ if(!S.draft[s.id]) S.draft[s.id]="A"; }); S.dirty=true; renderLista(); }
  else if(act==="clear"){ S.draft={}; S.dirty=true; renderLista(); }
  else if(act==="discard"){ S.dirty=false; S.remoteNote=false; renderLista(); }
  else if(act==="save") saveList();
  else if(act==="newgroup"){ S.view="grupos"; S.form={id:null,name:"",program:"UNID",schedule:"",teacher:"",studentsText:""}; render(); $("#g-name")?.focus(); }
  else if(act==="editgroup"){ const g=S.groups.find(x=>x.id===b.dataset.gid); if(!g) return; S.view="grupos"; S.form={id:g.id,name:g.name||"",program:g.program||"UNID",schedule:g.schedule||"",teacher:g.teacher||"",studentsText:(g.students||[]).map(s=>(s.mat?s.mat+"\t":"")+s.name).join("\n")}; render(); window.scrollTo(0,0); }
  else if(act==="cancelform"){ S.form=null; renderGrupos(true); }
  else if(act==="delgroup"){
    const id=b.dataset.gid;
    if(S.delArm!==id){ S.delArm=id; renderGrupos(false); return; }
    S.delArm=null;
    try{ await S.db.doc("groups/"+id).delete(); if(S.gid===id) S.gid=null; toast("Grupo eliminado"); }
    catch(err){ S.err="No se pudo eliminar el grupo. Revisa tu conexión e inténtalo de nuevo."; render(); }
  }
  else if(act==="repgroup"){ S.rep.gid=b.dataset.gid; const g=S.groups.find(x=>x.id===S.rep.gid); if(g&&S.rep.program&&g.program!==S.rep.program) S.rep.program=""; renderCoord(); }
  else if(act==="csv") exportCSV();
  else if(act==="wa"){ const g=currentGroup(); const a=g&&S.att.get(attKey(g.id,S.date)); if(a) waOpen(dayReport(g,a)); }
  else if(act==="wacum"){ const g=currentGroup(); if(g) waOpen(cumReport(g)); }
  else if(act==="lock"){ S.isCoord=false; store.set("pl.coord","0"); S.view="lista"; render(); }
  else if(act==="seed"){
    b.disabled=true;
    try{ for(const g of SEED){ const {id,...data}=g; await S.db.doc("groups/"+id).set(Object.assign({createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdBy:null},data)); } toast("Grupos cargados"); }
    catch(x){ S.err="No se pudieron cargar los grupos. Revisa las reglas de Firestore."; render(); }
  }
});
document.addEventListener("keydown", e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches("tr[data-act]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="f-date"){ if(!t.value) return; confirmLeave(); S.date=t.value; renderLista(); }
  else if(t.id==="r-program"){ S.rep.program=t.value; S.rep.gid=""; renderCoord(); }
  else if(t.id==="r-gid"){ S.rep.gid=t.value; renderCoord(); }
  else if(t.id==="r-from"&&t.value){ S.rep.from=t.value; renderCoord(); }
  else if(t.id==="r-to"&&t.value){ S.rep.to=t.value; renderCoord(); }
  else if(t.id==="r-risk"){ const n=parseInt(t.value,10); if(n>0){ S.rep.risk=n; renderCoord(); } }
});
document.addEventListener("input", e=>{
  const f=S.form; if(!f) return;
  const map={"g-name":"name","g-program":"program","g-schedule":"schedule","g-teacher":"teacher","g-students":"studentsText"};
  if(map[e.target.id]){ f[map[e.target.id]]=e.target.value; if(e.target.id==="g-students") updateCount(); }
});
document.addEventListener("submit", async e=>{
  if(e.target.id==="pinform"){
    e.preventDefault();
    if($("#pin").value.trim()===String(PIN_COORDINACION)){ S.isCoord=true; store.set("pl.coord","1"); render(); }
    else { $("#pin-err").hidden=false; }
    return;
  }
  if(e.target.id!=="gform") return;
  e.preventDefault();
  const f=S.form, err=$("#g-err");
  f.program=$("#g-program").value;
  const name=f.name.trim();
  if(!name){ err.textContent="Escribe el nombre del grupo."; err.hidden=false; return; }
  const prev = f.id ? (S.groups.find(g=>g.id===f.id)?.students||[]) : [];
  const byName = new Map(prev.map(s=>[s.name.trim().toLowerCase(), s.id]));
  const byMat = new Map(prev.filter(s=>s.mat).map(s=>[s.mat, s.id]));
  const used=new Set();
  const students = f.studentsText.split(/\r?\n/).map(parseStudent).filter(Boolean).map(p=>{
    let id=(p.mat&&byMat.get(p.mat))||byName.get(p.name.toLowerCase());
    if(!id||used.has(id)) id = (p.mat && !used.has("m"+p.mat)) ? "m"+p.mat : rid();
    used.add(id); const o={id,name:p.name}; if(p.mat) o.mat=p.mat; return o;
  });
  const btn=$("#g-save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    const ref = f.id ? S.db.doc("groups/"+f.id) : S.db.collection("groups").doc();
    const old = f.id ? S.groups.find(g=>g.id===f.id) : null;
    await ref.set({name, program:f.program, schedule:f.schedule.trim(), teacher:f.teacher.trim(), students,
      createdAt: old?.createdAt || new Date().toISOString(), createdBy: old?.createdBy || S.myId || null, updatedAt:new Date().toISOString()});
    S.form=null; S.gid=ref.id; store.set("pl.gid",S.gid); S.err=null;
    toast("Grupo guardado"); renderGrupos(true);
  }catch(x){
    btn.disabled=false; btn.textContent="Guardar grupo";
    err.textContent = x&&x.code==="invalid_argument" ? "No tienes permiso para guardar grupos en esta página. Pide a coordinación el permiso «Puede editar»." : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.";
    err.hidden=false;
  }
});

async function saveList(){
  const g=currentGroup(); if(!g||!S.db) return;
  const ids=new Set((g.students||[]).map(s=>s.id));
  const marks={}; Object.keys(S.draft).forEach(k=>{ if(ids.has(k)) marks[k]=S.draft[k]; });
  S.saving=true; renderLista();
  try{
    await S.db.doc("attendance/"+attKey(g.id,S.date)).set({groupId:g.id, groupName:g.name, date:S.date, marks, takenBy:g.teacher||"", updatedAt:new Date().toISOString()});
    S.dirty=false; S.remoteNote=false; S.err=null; toast("Lista guardada. Ahora envíala por WhatsApp");
  }catch(x){
    if(x&&x.code==="invalid_argument"){ S.readOnly=true; }
    else S.err="No se pudo guardar la lista. Tus marcas siguen aquí; inténtalo de nuevo.";
  }
  S.saving=false; renderLista();
}

async function exportCSV(){
  const r=S.rep;
  const groups=S.groups.filter(g=>(!r.program||g.program===r.program)&&(!r.gid||g.id===r.gid));
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=[["Fecha","Programa","Grupo","Maestro","Matrícula","Alumno","Estado","Registró"].map(q).join(",")];
  groups.forEach(g=>{
    [...S.att.values()].filter(a=>a.groupId===g.id&&inRange(a)).sort((a,b)=>a.date<b.date?-1:1).forEach(a=>{
      (g.students||[]).forEach(s=>{ const m=(a.marks||{})[s.id]; lines.push([a.date,g.program,g.name,g.teacher,s.mat||"",s.name,m?CODES[m]:"Sin marcar",who(a.takenBy)].map(q).join(",")); });
    });
  });
  try{
    const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`asistencia_${r.from}_a_${r.to}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  }catch(x){ if(!x||x.code!=="declined") toast("No se pudo descargar el archivo"); }
}

/* ---------- boot: todo se guarda en este teléfono (localStorage) ---------- */
const LS_KEY="pase_de_lista_v1";
let mem={};
try{ localStorage.setItem("pl.test","1"); localStorage.removeItem("pl.test"); mem=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}; }
catch(e){ S.offline=true; }
/* Primera vez en este teléfono: los grupos iniciales se cargan solos */
if(!S.offline && !Object.keys(mem).some(k=>k.startsWith("groups/"))){
  const now=new Date().toISOString();
  SEED.forEach(g=>{ const {id,...data}=g; mem["groups/"+id]=Object.assign({createdAt:now,updatedAt:now,createdBy:null},data); });
  try{ localStorage.setItem(LS_KEY, JSON.stringify(mem)); }catch(e){}
}
render();
(async()=>{
  if(S.offline) return;
  const persist=()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(mem)); return true; }catch(e){ return false; } };
  const subs=[];
  const snapFor=col=>({ docs:Object.keys(mem).filter(k=>k.split("/")[0]===col).map(k=>({id:k.split("/")[1], data:()=>mem[k]})), metadata:{hasPendingWrites:false} });
  const notify=()=>subs.forEach(x=>x.fn(snapFor(x.col)));
  S.db={
    doc:p=>({ id:p.split("/")[1],
      set:async d=>{ const prev=mem[p]; mem[p]=JSON.parse(JSON.stringify(d)); if(!persist()){ if(prev===undefined) delete mem[p]; else mem[p]=prev; throw {code:"storage"}; } setTimeout(notify,0); },
      delete:async()=>{ delete mem[p]; persist(); setTimeout(notify,0); } }),
    collection:c=>({ doc:id=>S.db.doc(c+"/"+(id||rid())), onSnapshot:fn=>{ subs.push({col:c,fn}); setTimeout(()=>fn(snapFor(c)),0); return ()=>{}; } })
  };
  const onErr = e => { S.err = (e&&e.code==="permission-denied") ? "Firestore rechazó el acceso. Revisa las reglas de seguridad de las colecciones asistencia_." : "Se perdió la conexión con los datos. Recarga la página."; render(); };
  S.db.collection("groups").onSnapshot(snap=>{
    S.groups=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.program||"").localeCompare(b.program||"")||(a.name||"").localeCompare(b.name||"","es"));
    S.groupsReady=true;
    render(false);
  }, onErr);
  S.db.collection("attendance").onSnapshot(snap=>{
    const g=currentGroup(); const key=g?attKey(g.id,S.date):null;
    const before=key?S.att.get(key):null;
    S.att=new Map(snap.docs.map(d=>[d.id,d.data()]));
    S.attReady=true;
    const after=key?S.att.get(key):null;
    if(S.dirty&&!S.saving&&after&&after.updatedAt!==(before&&before.updatedAt)&&!snap.metadata.hasPendingWrites) S.remoteNote=true;
    render(false);
  }, onErr);
})();
})();
</script>
