<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación: Money & Actions</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONOS SVG (Reemplazo de lucide-react para versión HTML única) ---
        const IconWrapper = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const ArrowRight = (props) => <IconWrapper {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></IconWrapper>;
        const ArrowLeft = (props) => <IconWrapper {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconWrapper>;
        const DollarSign = (props) => <IconWrapper {...props}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></IconWrapper>;
        const ShoppingCart = (props) => <IconWrapper {...props}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></IconWrapper>;
        const RefreshCw = (props) => <IconWrapper {...props}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></IconWrapper>;
        const PiggyBank = (props) => <IconWrapper {...props}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2.5V5z"></path><path d="M2 9v1c0 1.1.9 2 2 2h1"></path><path d="M16 11h.01"></path></IconWrapper>;
        const Trash2 = (props) => <IconWrapper {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconWrapper>;
        const CreditCard = (props) => <IconWrapper {...props}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></IconWrapper>;
        const Store = (props) => <IconWrapper {...props}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"></path><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"></path><path d="M2 7h20"></path><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"></path></IconWrapper>;
        const CheckCircle = (props) => <IconWrapper {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconWrapper>;
        const XCircle = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconWrapper>;
        const Tag = (props) => <IconWrapper {...props}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></IconWrapper>;

        // --- APP PRINCIPAL ---

        const VocabularyApp = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            const [quizScore, setQuizScore] = useState(0);
            const [showQuizFeedback, setShowQuizFeedback] = useState(false);
            const [selectedAnswer, setSelectedAnswer] = useState(null);

            const definitions = [
                { id: 1, text: "Buy things on the internet", word: "shop online", icon: <ShoppingCart className="w-6 h-6" /> },
                { id: 2, text: "Give something to people for money", word: "sell", icon: <DollarSign className="w-6 h-6 text-green-600" /> },
                { id: 3, text: "Keep money for the future", word: "save", icon: <PiggyBank className="w-6 h-6 text-pink-500" /> },
                { id: 4, text: "Use something that belongs to someone for a short time", word: "borrow", icon: <ArrowLeft className="w-6 h-6 text-orange-500" /> },
                { id: 5, text: "Not use money in a good way", word: "waste", icon: <Trash2 className="w-6 h-6 text-gray-500" /> },
                { id: 6, text: "Have a price", word: "cost", icon: <div className="font-bold text-lg">$</div> },
                { id: 7, text: "Give something to someone for a time", word: "lend", icon: <ArrowRight className="w-6 h-6 text-blue-500" /> },
                { id: 8, text: "Use money to pay for something", word: "spend", icon: <CreditCard className="w-6 h-6 text-purple-500" /> },
                { id: 9, text: "Give someone the money that they gave you", word: "pay back", icon: <RefreshCw className="w-6 h-6" /> },
                { id: 10, text: "Take something back to the store because you don't like it", word: "return", icon: <Store className="w-6 h-6" /> },
            ];

            const totalSlides = 5 + definitions.length + 1;

            const nextSlide = () => {
                setCurrentSlide((prev) => Math.min(prev + 1, totalSlides - 1));
                setShowQuizFeedback(false);
                setSelectedAnswer(null);
            };

            const prevSlide = () => {
                setCurrentSlide((prev) => Math.max(prev - 1, 0));
            };

            // --- SLIDE COMPONENTS ---

            const IntroSlide = () => (
                <div className="flex flex-col items-center justify-center h-full text-center space-y-6 p-8 animate-fade-in">
                    <div className="bg-blue-100 p-6 rounded-full animate-bounce">
                        <DollarSign className="w-20 h-20 text-blue-600" />
                    </div>
                    <h1 className="text-4xl font-bold text-slate-800">Money & Actions</h1>
                    <p className="text-xl text-slate-600">Una lección interactiva sobre el vocabulario de dinero.</p>
                    <button onClick={nextSlide} className="px-8 py-3 bg-blue-600 text-white rounded-lg font-bold shadow-lg hover:bg-blue-700 transition-all transform hover:scale-105">
                        Comenzar
                    </button>
                </div>
            );

            const ContextSlide = () => (
                <div className="flex flex-col items-center h-full p-6 space-y-6">
                    <div className="w-full flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">Hábitos con el dinero</h2>
                        <span className="text-sm text-slate-400 font-mono">Parte 1</span>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full">
                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-pink-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <PiggyBank className="text-pink-500" />
                                <h3 className="font-bold">Ana</h3>
                            </div>
                            <p className="text-slate-600">Ana wants a new car next year. She doesn't buy pizza today. She keeps her money.</p>
                            <p className="mt-2 font-bold text-pink-600">→ Ana is saving.</p>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-purple-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <CreditCard className="text-purple-500" />
                                <h3 className="font-bold">Bob</h3>
                            </div>
                            <p className="text-slate-600">Bob buys a video game. It is $60. He uses his money.</p>
                            <p className="mt-2 font-bold text-purple-600">→ Bob spends money.</p>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-gray-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <Trash2 className="text-gray-500" />
                                <h3 className="font-bold">Carl</h3>
                            </div>
                            <p className="text-slate-600">Carl buys a gym membership but never goes. It is not good use of money.</p>
                            <p className="mt-2 font-bold text-gray-600">→ Carl wastes money.</p>
                        </div>
                    </div>
                </div>
            );

            const CommerceSlide = () => (
                <div className="flex flex-col items-center h-full p-6 space-y-6">
                    <div className="w-full flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">De compras (Shopping)</h2>
                        <span className="text-sm text-slate-400 font-mono">Parte 2</span>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full">
                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-blue-400 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <ShoppingCart className="text-blue-400" />
                                <h3 className="font-bold">Tina</h3>
                            </div>
                            <p className="text-slate-600">Tina doesn't go to the store. She buys shoes using her computer.</p>
                            <p className="mt-2 font-bold text-blue-500">→ Tina shops online.</p>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-green-600 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <Tag className="text-green-600" />
                                <h3 className="font-bold">The Shoes</h3>
                            </div>
                            <p className="text-slate-600">The label on the shoes says "$50". It has a price.</p>
                            <p className="mt-2 font-bold text-green-600">→ They cost $50.</p>
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-md border-l-4 border-emerald-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-2">
                                <DollarSign className="text-emerald-500" />
                                <h3 className="font-bold">Mark</h3>
                            </div>
                            <p className="text-slate-600">Mark gives his old bike to a friend for $100.</p>
                            <p className="mt-2 font-bold text-emerald-600">→ Mark sells his bike.</p>
                        </div>
                    </div>
                </div>
            );

            const RestoreSlide = () => (
                <div className="flex flex-col items-center h-full p-6 space-y-6">
                    <div className="w-full flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-slate-800">Devoluciones y Pagos</h2>
                        <span className="text-sm text-slate-400 font-mono">Parte 3</span>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-3xl">
                        <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-amber-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4">
                                <Store className="text-amber-500" />
                                <h3 className="font-bold text-lg">Wrong Size</h3>
                            </div>
                            <p className="text-slate-600 text-lg">I bought a shirt but it is too small! I take it back to the shop.</p>
                            <p className="mt-4 font-bold text-xl text-amber-600">→ I return the shirt.</p>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-500 hover:shadow-xl transition-shadow">
                            <div className="flex items-center gap-2 mb-4">
                                <RefreshCw className="text-indigo-500" />
                                <h3 className="font-bold text-lg">The Debt</h3>
                            </div>
                            <p className="text-slate-600 text-lg">You gave me $10 yesterday. Here is your $10 now.</p>
                            <p className="mt-4 font-bold text-xl text-indigo-600">→ I pay back the money.</p>
                        </div>
                    </div>
                </div>
            );

            const LendBorrowInduction = () => {
                const [step, setStep] = useState(0);

                return (
                    <div className="flex flex-col items-center h-full p-6">
                        <div className="w-full flex justify-between items-center mb-4">
                            <h2 className="text-2xl font-bold text-slate-800">El Dilema: ¿Quién mueve el objeto?</h2>
                            <span className="text-sm text-slate-400 font-mono">Parte 4</span>
                        </div>
                        
                        <p className="mb-6 text-slate-600 text-center">Mira la dirección de la flecha.</p>

                        <div className="flex flex-col md:flex-row items-center justify-center gap-12 w-full flex-grow">
                            
                            {/* Scenario 1 */}
                            <div className={`transition-all duration-500 ${step >= 0 ? 'opacity-100 translate-y-0' : 'opacity-50 translate-y-4'} flex flex-col items-center`}>
                                <div className="bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 text-center w-64 relative shadow-md">
                                    <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-bold">SCENARIO A</div>
                                    <p className="mb-4 font-medium">I have a pen. You need a pen.</p>
                                    <p className="mb-2">I give it to you.</p>
                                    <div className="flex items-center justify-center gap-4 my-4">
                                        <span className="text-2xl">🧑 (Me)</span>
                                        <ArrowRight className="w-8 h-8 text-blue-600 animate-pulse" />
                                        <span className="text-2xl">👱 (You)</span>
                                    </div>
                                    {step >= 1 ? (
                                        <p className="font-bold text-xl text-blue-700 animate-fade-in">I LEND the pen.</p>
                                    ) : (
                                        <button onClick={() => setStep(1)} className="bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-1 rounded-lg text-sm font-bold transition-colors">¿Qué verbo es?</button>
                                    )}
                                </div>
                                {step >= 1 && <p className="mt-2 text-sm text-slate-500 animate-fade-in">Prestar (Dar temporalmente)</p>}
                            </div>

                            {/* Scenario 2 */}
                            <div className={`transition-all duration-500 ${step >= 1 ? 'opacity-100 translate-y-0' : 'opacity-50 translate-y-4'} flex flex-col items-center`}>
                                <div className="bg-orange-50 p-6 rounded-2xl border-2 border-orange-200 text-center w-64 relative shadow-md">
                                    <div className="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-orange-600 text-white px-3 py-1 rounded-full text-sm font-bold">SCENARIO B</div>
                                    <p className="mb-4 font-medium">I need a pen. You have a pen.</p>
                                    <p className="mb-2">I take/receive it from you.</p>
                                    <div className="flex items-center justify-center gap-4 my-4">
                                        <span className="text-2xl">🧑 (Me)</span>
                                        <ArrowLeft className="w-8 h-8 text-orange-600 animate-pulse" />
                                        <span className="text-2xl">👱 (You)</span>
                                    </div>
                                    {step >= 2 ? (
                                        <p className="font-bold text-xl text-orange-700 animate-fade-in">I BORROW the pen.</p>
                                    ) : (
                                        <button onClick={() => setStep(2)} disabled={step < 1} className="bg-orange-100 hover:bg-orange-200 text-orange-700 px-4 py-1 rounded-lg text-sm font-bold disabled:opacity-50 disabled:cursor-not-allowed transition-colors">¿Qué verbo es?</button>
                                    )}
                                </div>
                                {step >= 2 && <p className="mt-2 text-sm text-slate-500 animate-fade-in">Pedir prestado (Tomar temporalmente)</p>}
                            </div>

                        </div>
                    </div>
                );
            };

            const QuizSlide = ({ definitionIndex }) => {
                const currentDef = definitions[definitionIndex];
                const options = useMemo(() => {
                    const others = definitions.filter(d => d.id !== currentDef.id).sort(() => 0.5 - Math.random()).slice(0, 2);
                    return [currentDef, ...others].sort(() => 0.5 - Math.random());
                }, [currentDef]);

                const handleSelect = (word) => {
                    if (showQuizFeedback) return;
                    setSelectedAnswer(word);
                    setShowQuizFeedback(true);
                    if (word === currentDef.word) {
                        setQuizScore(prev => prev + 1);
                    }
                };

                return (
                    <div className="flex flex-col items-center h-full p-6 max-w-2xl mx-auto w-full">
                        <div className="w-full flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-slate-800">Práctica: Definiciones</h2>
                            <span className="bg-slate-100 px-3 py-1 rounded-full text-sm font-mono">Item {definitionIndex + 1}/10</span>
                        </div>

                        <div className="bg-white w-full p-8 rounded-2xl shadow-lg border border-slate-100 mb-8 text-center transform transition-all">
                            <p className="text-slate-400 text-sm uppercase tracking-wider font-bold mb-4">Definition</p>
                            <p className="text-2xl font-medium text-slate-800">"{currentDef.text}"</p>
                        </div>

                        <div className="grid grid-cols-1 gap-3 w-full">
                            {options.map((opt) => (
                                <button
                                    key={opt.id}
                                    onClick={() => handleSelect(opt.word)}
                                    className={`
                                        p-4 rounded-xl font-bold text-lg transition-all flex items-center justify-between shadow-sm
                                        ${showQuizFeedback && opt.word === currentDef.word ? 'bg-green-100 border-2 border-green-500 text-green-800' : ''}
                                        ${showQuizFeedback && opt.word === selectedAnswer && opt.word !== currentDef.word ? 'bg-red-100 border-2 border-red-500 text-red-800' : ''}
                                        ${!showQuizFeedback ? 'bg-white hover:bg-blue-50 border-2 border-transparent hover:border-blue-200 text-slate-700' : ''}
                                        ${showQuizFeedback && opt.word !== currentDef.word && opt.word !== selectedAnswer ? 'opacity-50' : ''}
                                    `}
                                >
                                    <span className="flex items-center gap-3">
                                        {opt.icon}
                                        {opt.word}
                                    </span>
                                    {showQuizFeedback && opt.word === currentDef.word && <CheckCircle className="text-green-600" />}
                                    {showQuizFeedback && opt.word === selectedAnswer && opt.word !== currentDef.word && <XCircle className="text-red-600" />}
                                </button>
                            ))}
                        </div>
                        
                        {showQuizFeedback && (
                            <div className="mt-6 animate-bounce">
                                <button onClick={nextSlide} className="bg-slate-800 text-white px-6 py-2 rounded-lg font-bold shadow-lg hover:bg-slate-900 transition-colors">Siguiente →</button>
                            </div>
                        )}
                    </div>
                );
            };

            const SummarySlide = () => (
                <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-6">
                    <h2 className="text-3xl font-bold text-slate-800">¡Excelente trabajo!</h2>
                    <p className="text-xl text-slate-600">Has revisado todo el vocabulario.</p>
                    
                    <div className="grid grid-cols-2 gap-4 text-left bg-white p-6 rounded-xl shadow-sm max-w-md w-full">
                        <div className="border-b pb-2">
                            <span className="font-bold text-blue-600 block">Lend</span>
                            <span className="text-sm text-slate-500">Dar (temporalmente) →</span>
                        </div>
                        <div className="border-b pb-2">
                            <span className="font-bold text-orange-600 block">Borrow</span>
                            <span className="text-sm text-slate-500">← Recibir/Pedir (temporalmente)</span>
                        </div>
                        <div className="border-b pb-2">
                            <span className="font-bold text-green-600 block">Sell</span>
                            <span className="text-sm text-slate-500">Dar por dinero</span>
                        </div>
                        <div className="border-b pb-2">
                            <span className="font-bold text-pink-600 block">Save</span>
                            <span className="text-sm text-slate-500">Guardar para futuro</span>
                        </div>
                        <div className="border-b pb-2">
                            <span className="font-bold text-indigo-600 block">Pay back</span>
                            <span className="text-sm text-slate-500">Devolver dinero</span>
                        </div>
                        <div className="border-b pb-2">
                            <span className="font-bold text-amber-600 block">Return</span>
                            <span className="text-sm text-slate-500">Devolver producto</span>
                        </div>
                    </div>

                    <button onClick={() => {setCurrentSlide(0); setQuizScore(0);}} className="text-blue-600 font-bold hover:underline">
                        Volver a empezar
                    </button>
                </div>
            );

            const renderSlide = () => {
                if (currentSlide === 0) return <IntroSlide />;
                if (currentSlide === 1) return <ContextSlide />;
                if (currentSlide === 2) return <CommerceSlide />;
                if (currentSlide === 3) return <RestoreSlide />;
                if (currentSlide === 4) return <LendBorrowInduction />;
                if (currentSlide >= 5 && currentSlide < 5 + definitions.length) {
                    return <QuizSlide definitionIndex={currentSlide - 5} />;
                }
                return <SummarySlide />;
            };

            return (
                <div className="w-full h-screen bg-slate-50 flex flex-col items-center justify-center font-sans text-slate-900">
                    <div className="w-full max-w-4xl h-full md:h-[650px] bg-white md:rounded-3xl shadow-2xl overflow-hidden flex flex-col relative border border-slate-200">
                        
                        {/* Progress Bar */}
                        <div className="h-2 bg-slate-100 w-full">
                            <div 
                                className="h-full bg-blue-500 transition-all duration-500"
                                style={{ width: `${((currentSlide + 1) / totalSlides) * 100}%` }}
                            ></div>
                        </div>

                        {/* Main Content */}
                        <div className="flex-grow overflow-y-auto relative">
                            {renderSlide()}
                        </div>

                        {/* Footer */}
                        <div className="h-16 border-t bg-slate-50 flex items-center justify-between px-6">
                            <button 
                                onClick={prevSlide} 
                                disabled={currentSlide === 0}
                                className={`text-slate-500 font-bold hover:text-blue-600 disabled:opacity-30 flex items-center gap-2 transition-colors`}
                            >
                                <ArrowLeft size={18} /> Anterior
                            </button>

                            <span className="text-slate-400 font-mono text-sm hidden md:inline">
                                Slide {currentSlide + 1} / {totalSlides}
                            </span>

                            <button 
                                onClick={nextSlide} 
                                disabled={currentSlide >= totalSlides - 1 || (currentSlide >= 5 && currentSlide < 15 && !showQuizFeedback)}
                                className={`text-blue-600 font-bold hover:text-blue-800 disabled:opacity-0 flex items-center gap-2 transition-opacity`}
                            >
                                Siguiente <ArrowRight size={18} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
