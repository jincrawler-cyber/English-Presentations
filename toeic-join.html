   </tbody></table></div>`},
  {title:"No article: general meaning", lead:"Plural and uncountable nouns used in a general sense take no article.",
   body:`<ul class="ex"><li class="yes"><mark>Prices</mark> are rising across the region.</li>
   <li class="yes"><mark>Inflation</mark> is a concern for small businesses.</li>
   <li class="no">The inflation is a concern for small businesses.</li></ul>
   <div class="cols"><div class="col"><b>Names</b><small>people, companies, cities, most countries</small>Ms. Ortega · Delmar Logistics · Japan</div>
   <div class="col"><b>Meals</b><small>breakfast, lunch, dinner</small>have lunch with a client</div>
   <div class="col"><b>Fixed phrases</b><small>by + transport, at + place</small>by bus · at work · at night · on time</div></div>
   <div class="tip">En español decimos "<b>la</b> inflación es un problema" o "<b>los</b> precios suben". En inglés, si hablas en general, va <b>sin artículo</b>.</div>`},
  {title:"Countable or uncountable?", lead:"These business nouns are uncountable. No a/an, no plural -s.",
   body:`<div class="tbl"><table><thead><tr><th>Uncountable</th><th>Correct</th><th>Wrong</th></tr></thead><tbody>
   <tr><td>information</td><td>some information · a piece of information</td><td>an information · informations</td></tr>
   <tr><td>advice</td><td>some advice · a piece of advice</td><td>an advice · advices</td></tr>
   <tr><td>equipment, furniture</td><td>new equipment · office furniture</td><td>equipments · a furniture</td></tr>
   <tr><td>luggage, baggage</td><td>your luggage</td><td>luggages</td></tr>
   <tr><td>feedback, research</td><td>useful feedback · a lot of research</td><td>a feedback · researches</td></tr>
   <tr><td>news</td><td>The news <b>is</b> good.</td><td>a news · the news are</td></tr>
   </tbody></table></div>`},
  {title:"A few, few, a little, little", lead:"The article changes the meaning. With a, the idea is positive.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>countable</b><ul class="ex"><li><mark>a few</mark> = some, enough<br><span class="hint">We have a few ideas.</span></li><li><mark>few</mark> = almost none<br><span class="hint">Few applicants met the requirements.</span></li></ul></div>
   <div class="col"><b>uncountable</b><ul class="ex"><li><mark>a little</mark> = some, enough<br><span class="hint">There's a little time for questions.</span></li><li><mark>little</mark> = almost none<br><span class="hint">There is little time left, so hurry.</span></li></ul></div></div>`},
  {title:"TOEIC traps", lead:"Check these before you choose.",
   body:`<ul class="ex"><li class="no">She is engineer.</li><li class="yes">She is <mark>an</mark> engineer.</li>
   <li class="no">an useful tool · a hour</li><li class="yes"><mark>a</mark> useful tool · <mark>an</mark> hour</li>
   <li class="no">I go to the work by the car.</li><li class="yes">I go to work by car.</li>
   <li class="no">Can you give me an advice?</li><li class="yes">Can you give me <mark>some</mark> advice?</li></ul>
   <div class="tip">"Es ingeniera" no lleva artículo en español, pero en inglés las profesiones siempre llevan <b>a/an</b>.</div>`}
  ],
  quiz:[
  ["Ms. Rivera has ___ appointment with the bank manager at 3 p.m.",["an","a","the",NA],"<em>Appointment</em> starts with a vowel sound and it's mentioned for the first time → <b>an</b>."],
  ["Our company was founded by ___ European entrepreneur.",["a","an","the",NA],"<em>European</em> starts with a /j/ sound (\"you\"), a consonant sound → <b>a</b>."],
  ["The job interview lasted ___ hour.",["an","a","the",NA],"The <em>h</em> in <em>hour</em> is silent, so it starts with a vowel sound → <b>an</b>."],
  ["Please send me ___ report you mentioned in yesterday's meeting.",["the","a","an",NA],"A clause defines exactly which report (<em>you mentioned…</em>) → <b>the</b>."],
  ["___ CEO of Delmar Logistics will speak at the conference.",["The","A","An",NA],"A company has only one CEO → <b>The</b>."],
  ["Mr. Park is ___ accountant at a large firm in Monterrey.",["an","a","the",NA],"Jobs need a/an, and <em>accountant</em> starts with a vowel sound → <b>an</b>."],
  ["We need more ___ before we make a decision.",["information","informations","an information","the informations"],"<em>Information</em> is uncountable: no plural and no a/an → <b>information</b>."],
  ["Could you give me some ___ about the new pension plan?",["advice","advices","an advice","a advice"],"<em>Advice</em> is uncountable → <b>some advice</b>."],
  ["This is ___ most efficient printer we have ever purchased.",["the","a","an",NA],"Superlatives take <b>the</b>."],
  ["___ prices of raw materials have increased this year.",["The","A","An",NA],"<em>Of raw materials</em> defines which prices → <b>The</b>."],
  ["___ inflation is a major concern for small businesses.",[NA,"The","An","A"],"General uncountable noun → <b>no article</b>. (En español sí diríamos \"la inflación\".)"],
  ["The new manager graduated from ___ university in Canada.",["a","an","the",NA],"<em>University</em> starts with a /j/ sound → <b>a</b>."],
  ["She earns $25 ___ hour as a freelance translator.",["an","a","the","per the"],"In prices and rates, a/an = per. Silent h → <b>an</b> hour."],
  ["The team meets twice ___ week to review progress.",["a","the","an",NA],"Frequency: <em>twice a week</em> (= per week) → <b>a</b>."],
  ["We ordered new ___ for the conference room.",["furniture","furnitures","a furniture","the furnitures"],"<em>Furniture</em> is uncountable → <b>furniture</b>."],
  ["Mr. Gómez travels to ___ United States every quarter.",["the","a",NA,"an"],"Country names with <em>States, Kingdom, Republic</em> take <b>the</b>."],
  ["Ms. Lee has worked in ___ Japan for five years.",[NA,"the","a","an"],"Most country names take <b>no article</b>."],
  ["Our office is on ___ third floor of the building.",["the","a",NA,"an"],"Ordinal numbers (<em>first, second, third</em>) take <b>the</b>."],
  ["Most employees go to work by ___ bus.",[NA,"the","a","an"],"<em>By</em> + transport takes <b>no article</b>: by bus, by car, by train."],
  ["Please arrive on ___ time for the training session.",[NA,"the","a","an"],"Fixed expression: <b>on time</b>, with no article."],
  ["There was ___ error in the invoice, so we sent a corrected copy.",["an","a","the",NA],"First mention + vowel sound → <b>an</b>."],
  ["We received a complaint yesterday. ___ complaint was about late delivery.",["The","A","An",NA],"Second mention: now we both know which complaint → <b>The</b>."],
  ["Mr. Tanaka has ___ MBA from a top business school.",["an","a","the",NA],"<em>MBA</em> is said \"em-bee-ay\", which starts with a vowel sound → <b>an</b>."],
  ["It was ___ honor to receive the Employee of the Year award.",["an","a","the",NA],"Silent h in <em>honor</em> → <b>an</b>."],
  ["This is ___ unique opportunity to expand into Latin America.",["a","an","the",NA],"<em>Unique</em> starts with a /j/ sound → <b>a</b>."],
  ["We still need ___ equipment for the new lab.",["some","an","a","many"],"<em>Equipment</em> is uncountable: use <b>some</b>, not a/an or <em>many</em>."],
  ["The latest ___ from the head office is very encouraging.",["news","new","a news","newses"],"<em>News</em> is uncountable and takes a singular verb (<em>is</em>) → <b>news</b>."],
  ["All passengers must check their ___ at counter 5.",["luggage","luggages","a luggage","the luggages"],"<em>Luggage</em> is uncountable → <b>luggage</b>."],
  ["Mr. Díaz usually has ___ lunch with clients on Fridays.",[NA,"the","a","an"],"Meals take <b>no article</b>: have lunch, have dinner."],
  ["___ Mexico City office will close early on Friday.",["The","A","An",NA],"A specific office that both people know → <b>The</b>. (<em>Mexico City</em> describes the office.)"],
  ["We are looking for ___ experienced sales representative.",["an","a","the",NA],"The article goes with the next word: <em>experienced</em> starts with a vowel sound → <b>an</b>."],
  ["We received ___ useful feedback from customers.",["some","a","an","many"],"<em>Feedback</em> is uncountable → <b>some</b>."],
  ["She is one of ___ best negotiators in the company.",["the","a",NA,"an"],"<em>One of the</em> + superlative → <b>the</b>."],
  ["Please read ___ instructions on page 4 before using the machine.",["the","an","a",NA],"Specific instructions (<em>on page 4</em>) → <b>the</b>."],
  ["The hotel has ___ swimming pool and a fitness center.",["a","an","the",NA],"First mention, singular countable, consonant sound → <b>a</b>."],
  ["___ Ms. Ortega will lead the workshop.",[NA,"The","A","An"],"Names of people take <b>no article</b>."],
  ["We will discuss the budget in ___ afternoon.",["the","a",NA,"an"],"Fixed expression: <b>in the</b> morning / afternoon / evening."],
  ["The museum is closed at ___ night.",[NA,"the","a","an"],"Fixed expression: <b>at night</b>, with no article."],
  ["Can I speak to ___ person in charge of shipping?",["the","a","an",NA],"<em>In charge of shipping</em> identifies one specific person → <b>the</b>."],
  ["Our new software is ___ easy-to-use tool for tracking expenses.",["an","a","the",NA],"The article goes with <em>easy</em>, which starts with a vowel sound → <b>an</b>."],
  ["Only ___ few applicants met all the requirements.",["a","the",NA,"an"],"The fixed phrase is <b>only a few</b> (= a small number)."],
  ["There is ___ little time left, so we need to hurry.",[NA,"a","the","an"],"<em>So we need to hurry</em> shows a negative meaning: <em>little</em> = almost none → <b>no article</b>."],
  ["The awards dinner was held at ___ Hilton downtown.",["the","a","an",NA],"Hotel names take <b>the</b>."],
  ["Our company sells ___ solar panels to businesses across the region.",[NA,"the","a","an"],"General plural noun → <b>no article</b>."],
  ["The manager made ___ important announcement this morning.",["an","a","the",NA],"<em>Important</em> starts with a vowel sound → <b>an</b>."],
  ["Researchers have done a lot of ___ on remote work.",["research","researches","a research","the researches"],"<em>Research</em> is uncountable → <b>research</b>."],
  ["Ms. Chen is ___ only person who has the key to the safe.",["the","a","an",NA],"<em>Only</em> takes <b>the</b>: the only person."],
  ["The price is $40 ___ unit for orders of more than 100.",["per","the","an","by"],"In prices use <b>per</b> or <em>a</em>. <em>An unit</em> is wrong: <em>unit</em> starts with a /j/ sound."],
  ["Mr. Ruiz was promoted to ___ position of regional director.",["the","a","an",NA],"<em>Of regional director</em> defines the position → <b>the</b>."],
  ["We use ___ same supplier as our competitors.",["the","a",NA,"an"],"<em>Same</em> always takes <b>the</b>."]
  ]},

{ id:"tenses", key:"t5", n:"05", name:"Present & Past Tenses",
  blurb:"Present simple and continuous, past simple and continuous, present perfect, past perfect and their time signals.",
  slides:[
  {cover:true, title:"Present & Past Tenses", lead:"Find the time expression first. It usually tells you the tense."},
  {title:"Present simple vs. present continuous", lead:"Routines and facts vs. actions happening now or for a limited time.",
   body:`<div class="cols" style="--n:2">
   <div class="col"><b>Present simple</b><small>every day, usually, always, on Mondays, timetables</small><ul class="ex"><li>Ms. Kim <mark>prepares</mark> the report every Friday.</li><li>The train <mark>leaves</mark> at 7:45 tomorrow.</li></ul></div>
   <div class="col"><b>Present continuous</b><small>now, right now, currently, at the moment, this week</small><ul class="ex"><li>Mr. Ortiz <mark>is speaking</mark> with a client right now.</li><li>We <mark>are testing</mark> a new system this month.</li></ul></div></div>
   <div class="tip">Los <b>stative verbs</b> casi nunca van en continuo: know, need, want, own, belong, cost, prefer, understand. "I <s>am knowing</s>" → "I know".</div>`},
  {title:"Past simple vs. past continuous", lead:"A finished action at a specific time vs. an action in progress at that time.",
   body:`<div class="formula"><span class="chip">was / were + -ing</span><span class="arrow">when</span><span class="chip fill">past simple</span></div>
   <ul class="ex"><li>The company <mark>moved</mark> to Querétaro <mark>in 2019</mark>. <span class="hint">yesterday, last…, …ago, in + year</span></li>
   <li>The power went out <mark>while</mark> Ms. Ruiz <mark>was giving</mark> her presentation.</li>
   <li>I <mark>was reviewing</mark> the documents <mark>when</mark> I found an error.</li></ul>`},
  {title:"Present perfect", lead:"have / has + past participle. It connects the past with now.",
   body:`<div class="cols"><div class="col"><b>Unfinished time</b><small>this year, so far, since, for</small>We <mark>have opened</mark> three branches this year.</div>
   <div class="col"><b>Result now</b><small>just, already, yet</small>I <mark>haven't received</mark> the email yet.</div>
   <div class="col"><b>Experience</b><small>ever, never, the first time</small><mark>Have</mark> you ever <mark>been</mark> to our Monterrey office?</div></div>
   <div class="tip"><b>since</b> + momento (since 2020, since January) · <b>for</b> + duración (for three years). "Since three years" es incorrecto.</div>`},
  {title:"Present perfect or past simple?", lead:"If the time is finished and stated, use the past simple.",
   body:`<div class="tbl"><table><thead><tr><th>Present perfect</th><th>Past simple</th></tr></thead><tbody>
   <tr><td>Sales <b>have risen</b> this year.</td><td>Sales <b>rose</b> last year.</td></tr>
   <tr><td>I <b>have worked</b> here since 2015.</td><td>I <b>worked</b> there from 2010 to 2015.</td></tr>
   <tr><td>The client <b>has</b> just <b>called</b>.</td><td>The client <b>called</b> an hour ago.</td></tr>
   <tr><td>over the past month · so far · recently</td><td>yesterday · last week · ago · in 2019</td></tr>
   </tbody></table></div>
   <div class="tip">"Trabajo aquí desde 2015" → <b>I have worked here since 2015</b>, no "I work here since 2015". Y "Es la primera vez que…" → "This is the first time I <b>have</b>…".</div>`},
  {title:"Past perfect and perfect continuous", lead:"Two more forms that Part 5 tests.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>Past perfect: had + participle</b><small>the earlier of two past actions</small><ul class="ex"><li>By the time the client arrived, we <mark>had finished</mark> the proposal.</li><li>The meeting <mark>had already started</mark> when I got there.</li></ul></div>
   <div class="col"><b>Present perfect continuous</b><small>have been + -ing: duration up to now</small><ul class="ex"><li>The team <mark>has been working</mark> since 9 a.m.</li><li>I <mark>have been trying</mark> to call him all morning.</li></ul></div></div>`},
  {title:"TOEIC traps", lead:"Check these before you choose.",
   body:`<ul class="ex"><li class="no">The shipment has arrived two days ago.</li><li class="yes">The shipment <mark>arrived</mark> two days ago.</li>
   <li class="no">Did you finished the report?</li><li class="yes">Did you <mark>finish</mark> the report?</li>
   <li class="no">This software is belonging to IT.</li><li class="yes">This software <mark>belongs</mark> to IT.</li>
   <li class="no">I know Mr. Gómez since 2010.</li><li class="yes">I <mark>have known</mark> Mr. Gómez since 2010.</li></ul>`}
  ],
  quiz:[
  ["Ms. Kim ___ the sales report every Friday afternoon.",["prepares","is preparing","prepared","has prepared"],"<em>Every Friday</em> shows a routine → present simple: <b>prepares</b>."],
  ["Please be quiet. Mr. Ortiz ___ with an important client right now.",["is speaking","speaks","spoke","has spoken"],"<em>Right now</em> → present continuous: <b>is speaking</b>."],
  ["The company ___ its headquarters to Querétaro in 2019.",["moved","has moved","moves","was moving"],"<em>In 2019</em> is a finished time → past simple: <b>moved</b>."],
  ["We ___ three new branches since January.",["have opened","opened","open","are opening"],"<em>Since January</em> (up to now) → present perfect: <b>have opened</b>."],
  ["Mr. Lee ___ for the company since 2015.",["has worked","works","worked","is working"],"<em>Since</em> + a point in time → present perfect: <b>has worked</b>. (No: \"works since\".)"],
  ["I ___ the email yet. Could you resend it?",["haven't received","didn't receive","don't receive","am not receiving"],"<em>Yet</em> at the end of a negative → present perfect: <b>haven't received</b>."],
  ["The power went out while Ms. Ruiz ___ her presentation.",["was giving","gave","has given","gives"],"An action in progress when another happened → past continuous: <b>was giving</b>."],
  ["By the time the client arrived, we ___ the proposal.",["had finished","have finished","finish","were finishing"],"<em>By the time</em> + past → the earlier action takes past perfect: <b>had finished</b>."],
  ["This software ___ to the IT department.",["belongs","is belonging","are belonging","belonging"],"<em>Belong</em> is a stative verb, so it isn't used in the continuous → <b>belongs</b>."],
  ["Our sales ___ significantly over the past six months.",["have increased","increased","increase","are increasing"],"<em>Over the past six months</em> (up to now) → present perfect: <b>have increased</b>."],
  ["The shipment ___ two days ago.",["arrived","has arrived","arrives","had been arrived"],"<em>Ago</em> → past simple: <b>arrived</b>. The present perfect never goes with <em>ago</em>."],
  ["The train to Guadalajara ___ at 7:45 tomorrow morning.",["leaves","left","has left","was leaving"],"Timetables use the present simple, even for the future → <b>leaves</b>."],
  ["We ___ a new accounting system this month, so there may be delays.",["are testing","test","tested","had tested"],"A temporary situation (<em>this month</em>) → present continuous: <b>are testing</b>."],
  ["Mr. Tanaka ___ the contract yesterday.",["signed","has signed","signs","was signing"],"<em>Yesterday</em> → past simple: <b>signed</b>."],
  ["Have you ever ___ to our Monterrey office?",["been","went","go","going"],"Present perfect: <em>have</em> + past participle → <b>been</b>."],
  ["The team ___ on the project since 9 a.m. and they're exhausted.",["has been working","works","worked","is working"],"Duration from a past point up to now → present perfect continuous: <b>has been working</b>."],
  ["When I called, the manager ___ a meeting, so I left a message.",["was attending","attended","has attended","attends"],"In progress at the moment I called → past continuous: <b>was attending</b>."],
  ["Ms. Patel has just ___ the budget.",["approved","approve","approving","approves"],"<em>Has just</em> + past participle → <b>approved</b>."],
  ["Last quarter, our profits ___ by 12 percent.",["rose","have risen","rise","are rising"],"<em>Last quarter</em> is finished → past simple: <b>rose</b>."],
  ["The new printer ___ $1,200.",["costs","is costing","cost","has costing"],"<em>Cost</em> is stative; third person singular → <b>costs</b>."],
  ["I ___ Mr. Gómez since we were in university.",["have known","know","knew","am knowing"],"<em>Since</em> + stative verb → present perfect: <b>have known</b>."],
  ["Ms. Hill ___ in the Paris office at the moment.",["is working","works","worked","has worked"],"<em>At the moment</em> → present continuous: <b>is working</b>."],
  ["We ___ the problem until a customer reported it.",["didn't notice","haven't noticed","don't notice","aren't noticing"],"The story is in the past (<em>reported</em>) → past simple: <b>didn't notice</b>."],
  ["The conference that we ___ last week was very informative.",["attended","have attended","attend","are attending"],"<em>Last week</em> → past simple: <b>attended</b>."],
  ["So far this year, we ___ more than 2,000 orders.",["have processed","processed","process","had processed"],"<em>So far this year</em> (time not finished) → present perfect: <b>have processed</b>."],
  ["Mr. Díaz ___ his car keys, so he took a taxi.",["had lost","has lost","loses","is losing"],"He lost them before he took the taxi: the earlier past action → <b>had lost</b>."],
  ["The board ___ the new CEO in a meeting yesterday.",["chose","has chosen","chooses","is choosing"],"<em>Yesterday</em> → past simple: <b>chose</b>."],
  ["How long have you ___ at this company?",["worked","work","working","works"],"<em>Have</em> + past participle → <b>worked</b>."],
  ["Customer complaints ___ every year since we improved our service.",["have decreased","decrease","decreased","are decreasing"],"<em>Since</em> + past event, up to now → present perfect: <b>have decreased</b>."],
  ["While I ___ the documents, I found an error.",["was reviewing","reviewed","have reviewed","review"],"<em>While</em> + action in progress in the past → past continuous: <b>was reviewing</b>."],
  ["She usually ___ the bus, but today she is driving.",["takes","is taking","took","has taken"],"<em>Usually</em> → routine → present simple: <b>takes</b>."],
  ["Ms. Grant ___ the company before I joined.",["had already left","has already left","already leaves","is already leaving"],"Earlier of two past actions (before I joined) → past perfect: <b>had already left</b>."],
  ["Our CEO ___ to Tokyo twice this year.",["has traveled","traveled","travels","is traveling"],"<em>This year</em> isn't finished, and we count times → present perfect: <b>has traveled</b>."],
  ["The client ___ the order an hour ago.",["canceled","has canceled","cancels","had canceled"],"<em>An hour ago</em> → past simple: <b>canceled</b>."],
  ["Mr. Park ___ the answer to your question; ask him.",["knows","is knowing","knew","has knowing"],"<em>Know</em> is stative, never continuous → <b>knows</b>."],
  ["Interest rates ___ steadily at the moment.",["are rising","rise","rose","have risen"],"<em>At the moment</em> → present continuous: <b>are rising</b>."],
  ["The store ___ at 9 a.m. on weekdays.",["opens","is opening","opened","has opened"],"A regular schedule → present simple: <b>opens</b>."],
  ["I'm sorry, Ms. Chen isn't here. She ___ to lunch.",["has gone","goes","had gone","go"],"She left and isn't back yet (result now) → present perfect: <b>has gone</b>."],
  ["We ___ our supplier three times in the last two years.",["have changed","changed","change","are changing"],"<em>In the last two years</em> (up to now) → present perfect: <b>have changed</b>."],
  ["The meeting ___ when I arrived, so I missed the introduction.",["had already started","already starts","has already started","is already starting"],"It started before I arrived → past perfect: <b>had already started</b>."],
  ["Did you ___ the invoice to the client?",["send","sent","sending","sends"],"After <em>did</em>, use the base form → <b>send</b>."],
  ["Mr. Ortiz ___ in Spain for two years before he moved to Mexico.",["had lived","has lived","lives","is living"],"Earlier past period, before another past action → <b>had lived</b>."],
  ["Sales ___ when the new product launched in March.",["jumped","have jumped","jump","are jumping"],"<em>In March</em>, a finished time → past simple: <b>jumped</b>."],
  ["I ___ to reach Mr. Kim all morning, but his line is busy.",["have been trying","tried","try","am trying"],"An activity continuing up to now (<em>all morning</em>) → <b>have been trying</b>."],
  ["We ___ the proposal at the moment and will reply by Friday.",["are reviewing","review","reviewed","had reviewed"],"<em>At the moment</em> → present continuous: <b>are reviewing</b>."],
  ["The factory normally ___ 2,000 units per day.",["produces","is producing","produced","has producing"],"<em>Normally</em> → routine → present simple: <b>produces</b>."],
  ["Ms. Rivera ___ the company in 2010 and still works here.",["joined","has joined","joins","had joined"],"<em>In 2010</em> is a finished time → past simple: <b>joined</b>."],
  ["They ___ the warehouse when the fire alarm went off.",["were inspecting","inspected","have inspected","inspect"],"In progress when the alarm interrupted → past continuous: <b>were inspecting</b>."],
  ["The prices on our website ___ yesterday.",["changed","have changed","change","are changing"],"<em>Yesterday</em> → past simple: <b>changed</b>."],
  ["This is the first time I ___ a TOEIC exam.",["have taken","take","took","am taking"],"<em>This is the first time</em> + present perfect → <b>have taken</b>. (En español: \"es la primera vez que <em>presento</em>\".)"]
  ]},

{ id:"modals", key:"t6", n:"06", name:"Modals & Auxiliaries",
  blurb:"Can, must, should, might and more; perfect modals; do, be and have in questions, negatives and tags.",
  slides:[
  {cover:true, title:"Modals & Auxiliaries", lead:"After a modal, use the base verb: no <em>to</em>, no <em>-s</em>, no <em>-ing</em>."},
  {title:"The modal rule", lead:"Modals never change. The verb after them is always the base form.",
   body:`<div class="formula"><span class="chip fill">can · could · may · might · must · should · will · would · shall</span><span class="arrow">+</span><span class="chip">base verb</span></div>
   <ul class="ex"><li class="yes">All employees <mark>must wear</mark> their ID badges.</li>
   <li class="no">must to wear · musts wear · must wearing</li>
   <li class="yes">Ms. Chen <mark>can speak</mark> three languages.</li><li class="no">Ms. Chen cans speak / can speaks</li></ul>
   <div class="tip">Estas expresiones sí llevan <b>to</b>: have to, need to, ought to, be able to, used to. "Will can" no existe → <b>will be able to</b>.</div>`},
  {title:"What each modal means", lead:"In Part 5, the meaning of the sentence decides the modal.",
   body:`<div class="tbl"><table><thead><tr><th>Meaning</th><th>Modals</th><th>Example</th></tr></thead><tbody>
   <tr><td>Ability</td><td>can, could, be able to</td><td>We <b>will be able to</b> ship by Monday.</td></tr>
   <tr><td>Permission</td><td>can, may, could</td><td><b>May</b> I use your phone?</td></tr>
   <tr><td>Possibility</td><td>may, might, could</td><td>The shipment <b>might</b> arrive tomorrow.</td></tr>
   <tr><td>Obligation</td><td>must, have to</td><td>Guests <b>must</b> check out by noon.</td></tr>
   <tr><td>Advice</td><td>should, ought to, had better</td><td>You <b>had better</b> call the client.</td></tr>
   <tr><td>Deduction</td><td>must (sure), can't (impossible)</td><td>She <b>must</b> be in a meeting.</td></tr>
   <tr><td>Requests, offers</td><td>could you, would you, shall I</td><td><b>Shall</b> I help you with that?</td></tr>
   </tbody></table></div>`},
  {title:"Mustn't vs. don't have to", lead:"They look similar but mean very different things.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>mustn't</b><small>prohibition: it's not allowed</small>You <mark>mustn't</mark> smoke in the building.</div>
   <div class="col"><b>don't have to / needn't</b><small>no obligation: it's not necessary</small>You <mark>don't have to</mark> bring a laptop; we'll provide one.</div></div>
   <div class="tip"><b>No tienes que</b> = don't have to (no es necesario). <b>No debes</b> = mustn't (está prohibido). Es una de las confusiones más comunes.</div>`},
  {title:"Perfect modals: talking about the past", lead:"modal + have + past participle.",
   body:`<div class="tbl"><table><thead><tr><th>Form</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
   <tr><td>should have done</td><td>a good idea that didn't happen</td><td>We <b>should have ordered</b> more paper.</td></tr>
   <tr><td>could have done</td><td>possible, but it didn't happen</td><td>You <b>could have told</b> me earlier.</td></tr>
   <tr><td>must have done</td><td>logical deduction (sure)</td><td>Everyone <b>must have gone</b> home.</td></tr>
   <tr><td>might / may have done</td><td>possible, not sure</td><td>He <b>might have missed</b> the train.</td></tr>
   <tr><td>would have done</td><td>imaginary result</td><td>We <b>would have missed</b> the deadline without you.</td></tr>
   </tbody></table></div>`},
  {title:"Auxiliaries: do, be, have", lead:"Use them for questions, negatives, tags and short replies.",
   body:`<div class="cols"><div class="col"><b>do / does / did</b><small>+ base verb</small><mark>Did</mark> the manager <mark>approve</mark> it? · She <mark>doesn't</mark> work on Fridays.</div>
   <div class="col"><b>be</b><small>+ -ing / participle</small>The software <mark>is being</mark> installed. · Interns <mark>are not</mark> allowed.</div>
   <div class="col"><b>have</b><small>+ past participle</small><mark>Has</mark> the order <mark>been</mark> shipped?</div></div>
   <ul class="ex"><li>You finished the report, <mark>didn't you</mark>? · He hasn't replied, <mark>has he</mark>?</li>
   <li>I enjoy this job. — <mark>So do I</mark>. · I can't attend. — <mark>Neither can I</mark>.</li></ul>`},
  {title:"Polite business English and traps", lead:"These phrases appear often in TOEIC emails.",
   body:`<ul class="ex"><li><mark>Would you mind</mark> clos<mark>ing</mark> the door? <span class="hint">+ -ing</span></li>
   <li><mark>I would appreciate it if</mark> you could confirm by Friday.</li>
   <li><mark>Would you like</mark> some coffee? · <mark>Shall I</mark> book the room?</li>
   <li class="no">Can you to send me the file?</li><li class="yes">Can you send me the file?</li>
   <li class="no">I will can attend.</li><li class="yes">I <mark>will be able to</mark> attend.</li></ul>`}
  ],
  quiz:[
  ["All employees must ___ their ID badges at all times.",["wear","to wear","wearing","wears"],"Modal + base verb → <b>wear</b>."],
  ["Ms. Chen can ___ three languages fluently.",["speak","speaks","to speak","speaking"],"After <em>can</em>, base verb with no -s → <b>speak</b>."],
  ["You ___ smoke anywhere in the building. It's against company policy.",["must not","don't have to","needn't","might not"],"It's against policy, so it's prohibited → <b>must not</b>."],
  ["You ___ bring your laptop; we will provide one.",["don't have to","must not","can't","mustn't"],"It's not necessary (we provide one) → <b>don't have to</b>."],
  ["___ you send me the updated figures by noon?",["Could","Must","Ought","Need"],"A polite request → <b>Could</b> you…?"],
  ["We ___ have ordered more paper. Now we've run out.",["should","must","can","will"],"A good idea that didn't happen (regret) → <b>should have</b> + participle."],
  ["The office is dark. Everyone ___ have gone home.",["must","should","can","will"],"A logical deduction about the past → <b>must have</b> + participle."],
  ["Would you mind ___ the door?",["closing","close","to close","closed"],"<em>Would you mind</em> + <em>-ing</em> → <b>closing</b>."],
  ["Applicants ___ submit their forms by Friday.",["have to","has to","having to","haves to"],"Plural subject → <b>have to</b>."],
  ["I ___ to finish the report yesterday because of the system failure.",["wasn't able","couldn't","can't","mustn't"],"<em>To</em> follows the blank, so you need <b>wasn't able</b> (to). <em>Couldn't</em> doesn't take <em>to</em>."],
  ["The manager ___ like to meet you at 3 p.m.",["would","will","should","can"],"Polite form for wishes: <b>would like</b>."],
  ["___ I help you with your luggage?",["Shall","Must","Would","Ought"],"An offer → <b>Shall</b> I…?"],
  ["You had better ___ the client before noon.",["call","to call","calling","called"],"<em>Had better</em> + base verb → <b>call</b>."],
  ["Employees ought ___ report any safety hazards immediately.",["to","for","that","be"],"<em>Ought</em> always takes <b>to</b>: ought to report."],
  ["Next year, we will ___ offer online payments.",["be able to","can","could","able to"],"Two modals can't go together (<em>will can</em>) → <b>will be able to</b>."],
  ["The shipment ___ arrive tomorrow, but it isn't certain.",["might","must","has to","should have"],"Possibility, not certain → <b>might</b>."],
  ["___ the manager approve the request yesterday?",["Did","Does","Has","Was"],"Past simple question with a base verb (<em>approve</em>) → <b>Did</b>."],
  ["Ms. Lopez ___ not work on Fridays.",["does","do","is","has"],"Present simple negative, third person → <b>does</b> not work."],
  ["The documents ___ been signed by both parties.",["have","has","are","do"],"Plural subject + present perfect passive → <b>have</b> been signed."],
  ["The new software ___ being installed this week.",["is","are","has","does"],"Singular subject + <em>being</em> + participle (continuous passive) → <b>is</b>."],
  ["You finished the report, ___?",["didn't you","did you","don't you","haven't you"],"Positive past simple statement → negative tag with <em>did</em>: <b>didn't you</b>?"],
  ["Mr. Park hasn't replied yet, ___?",["has he","hasn't he","did he","does he"],"Negative statement with <em>has</em> → positive tag: <b>has he</b>?"],
  ["I enjoy working with this team. — So ___ I.",["do","am","have","does"],"<em>Enjoy</em> is present simple → <b>So do I</b>."],
  ["I can't attend the meeting. — Neither ___ I.",["can","do","am","can't"],"Repeat the auxiliary in positive form: <b>Neither can I</b>."],
  ["We ___ have missed the deadline if you hadn't helped us.",["would","will","should","must"],"Imaginary past result (third conditional) → <b>would have</b> missed."],
  ["Guests ___ check out by 12 p.m.",["must","must to","musts","are must"],"Modal + base verb, no <em>to</em> and no -s → <b>must</b>."],
  ["Ms. Ruiz isn't answering. She ___ be in a meeting.",["may","mays","may to","maybe"],"Possibility: modal <b>may</b> + base verb. <em>Maybe</em> is an adverb, not a modal."],
  ["You ___ worry about the cost; the company will pay for it.",["needn't","mustn't","can't","mightn't"],"It's not necessary to worry → <b>needn't</b>."],
  ["Customers ___ return items within 30 days of purchase.",["can","cans","can to","are can"],"Permission: <b>can</b> + base verb."],
  ["Our flight was canceled, so we ___ stay an extra night in Chicago.",["had to","must","have to","should"],"Past obligation → <b>had to</b>. <em>Must</em> has no past form."],
  ["Visitors ___ not park in the reserved spaces.",["may","are","have","been"],"Formal prohibition → <b>may not</b> + base verb."],
  ["I would appreciate it if you ___ confirm your attendance.",["could","can to","will to","must to"],"<em>I would appreciate it if you</em> + <b>could</b> + base verb."],
  ["You ___ have told me about the change. I would have prepared.",["could","must","can","will"],"A complaint: it was possible but you didn't → <b>could have</b> told."],
  ["The report ___ be finished by Monday; the client is waiting.",["has to","have to","having to","had to be"],"Singular subject + obligation → <b>has to</b>."],
  ["___ you like some coffee while you wait?",["Would","Will","Do","Shall"],"Polite offer → <b>Would</b> you like…?"],
  ["He ___ have taken the wrong train; he's usually on time.",["must","should","would","ought"],"A logical explanation for the past → <b>must have</b> taken."],
  ["We don't ___ to wear a suit on Fridays.",["need","must","should","can"],"<em>Don't need to</em> = it's not necessary → <b>need</b>."],
  ["___ the order been shipped yet?",["Has","Have","Did","Is"],"Singular subject + present perfect passive question → <b>Has</b>."],
  ["The printer ___ working again. Could you call IT?",["isn't","doesn't","hasn't","don't"],"Present continuous negative: <b>isn't</b> working."],
  ["When ___ the new policy take effect?",["does","is","has","do"],"Present simple question, singular subject, base verb (<em>take</em>) → <b>does</b>."],
  ["Ms. Grant ___ already left when I arrived.",["had","has","was","did"],"Past perfect: <b>had</b> + participle."],
  ["Interns ___ allowed to use the executive parking lot.",["are not","do not","have not","cannot"],"Passive <em>be allowed to</em> → <b>are not</b> allowed."],
  ["You ___ better check the figures again before sending them.",["had","would","should","have"],"Fixed expression: <b>had better</b> + base verb."],
  ["May I ___ your phone for a moment?",["use","to use","using","used"],"Modal + base verb → <b>use</b>."],
  ["Mr. Díaz used ___ work in our Tijuana branch.",["to","for","the","be"],"Past habit: <b>used to</b> + base verb."],
  ["Could you tell me where I ___ find the conference room?",["can","could to","may to","must to"],"Modal + base verb, no <em>to</em> → <b>can</b>."],
  ["You ___ to sign the form in blue or black ink.",["need","must","should","can"],"Only <b>need</b> takes <em>to</em> here. <em>Must, should, can</em> never take <em>to</em>."],
  ["The meeting ___ been postponed until next week.",["has","have","is","was"],"Singular subject + present perfect passive → <b>has</b> been."],
  ["We ___ be able to deliver your order until Monday.",["won't","don't","can't","aren't"],"<em>Be able to</em> needs a modal before it: <b>won't</b> be able to. (<em>Can't be able</em> is wrong.)"],
  ["Last year, Ms. Kim ___ speak only a little Spanish; now she is fluent.",["could","can","cans","could to"],"Past ability → <b>could</b> + base verb."]
  ]},

{ id:"pronouns", key:"t7", n:"07", name:"Pronouns",
  blurb:"Subject, object, possessive and reflexive forms; who, whom, whose and which; each, other and another.",
  slides:[
  {cover:true, title:"Pronouns", lead:"Check the job of the word: subject, object, owner, or the same person."},
  {title:"Five forms", lead:"In Part 5 the four options are often the same pronoun in different forms.",
   body:`<div class="tbl"><table><thead><tr><th>Subject</th><th>Object</th><th>Possessive adj.</th><th>Possessive pron.</th><th>Reflexive</th></tr></thead><tbody>
   <tr><td>I</td><td>me</td><td>my</td><td>mine</td><td>myself</td></tr>
   <tr><td>you</td><td>you</td><td>your</td><td>yours</td><td>yourself / yourselves</td></tr>
   <tr><td>he</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr>
   <tr><td>she</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr>
   <tr><td>it</td><td>it</td><td>its</td><td>—</td><td>itself</td></tr>
   <tr><td>we</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
   <tr><td>they</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr>
   </tbody></table></div>`},
  {title:"Read the slot", lead:"The words around the blank tell you which form you need.",
   body:`<div class="tbl"><table><thead><tr><th>Slot</th><th>Form</th><th>Example</th></tr></thead><tbody>
   <tr><td>___ + verb</td><td>subject</td><td>Mr. Lee and <mark>I</mark> will attend.</td></tr>
   <tr><td>verb / preposition + ___</td><td>object</td><td>Please send it to <mark>us</mark>.</td></tr>
   <tr><td>___ + noun</td><td>possessive adj.</td><td>The company announced <mark>its</mark> results.</td></tr>
   <tr><td>___ alone (no noun)</td><td>possessive pron.</td><td>These files aren't mine. They're <mark>yours</mark>.</td></tr>
   <tr><td>same person as subject</td><td>reflexive</td><td>Ms. Rivera introduced <mark>herself</mark>.</td></tr>
   </tbody></table></div>
   <div class="tip">Truco: quita a la otra persona. "Mr. Lee and <s>me</s> will attend" → "<s>Me</s> will attend" suena mal → <b>I</b>.</div>`},
  {title:"Reflexive pronouns", lead:"Three common uses.",
   body:`<div class="cols"><div class="col"><b>Same person</b><small>subject = object</small>Ms. Rivera introduced <mark>herself</mark>.</div>
   <div class="col"><b>Emphasis</b><small>that person, not someone else</small>The CEO <mark>himself</mark> answered the questions.</div>
   <div class="col"><b>by + reflexive</b><small>= alone, without help</small>He finished the report <mark>by himself</mark>.</div></div>
   <ul class="ex"><li class="no">Please contact myself with any questions.</li><li class="yes">Please contact <mark>me</mark> with any questions.</li></ul>`},
  {title:"Relative pronouns", lead:"They connect a description to a noun.",
   body:`<div class="tbl"><table><thead><tr><th>Pronoun</th><th>Use</th><th>Example</th></tr></thead><tbody>
   <tr><td>who</td><td>people (subject)</td><td>The employee <b>who</b> won the award…</td></tr>
   <tr><td>whom</td><td>people (object, after a preposition)</td><td>To <b>whom</b> should I address the letter?</td></tr>
   <tr><td>whose</td><td>possession</td><td>The candidate <b>whose</b> application impressed us…</td></tr>
   <tr><td>which</td><td>things; after a comma</td><td>The board approved the plan, <b>which</b> surprised everyone.</td></tr>
   <tr><td>that</td><td>people or things; never after a comma</td><td>The printer <b>that</b> we bought…</td></tr>
   <tr><td>where</td><td>places</td><td>the hotel <b>where</b> we stayed</td></tr>
   </tbody></table></div>`},
  {title:"Indefinite pronouns, other, another", lead:"Small words, frequent questions.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>Singular verb</b><small>everyone, someone, anyone, each, neither, none of + uncountable</small><ul class="ex"><li>Everyone <mark>is</mark> invited.</li><li>Each of the participants <mark>receives</mark> a certificate.</li></ul></div>
   <div class="col"><b>Other forms</b><small>another, the other, others, each other, one/ones</small><ul class="ex"><li>Would you like <mark>another</mark> coffee?</li><li>One office is in León; <mark>the other</mark> is in Monterrey.</li><li>I need a faster <mark>one</mark>.</li></ul></div></div>`},
  {title:"TOEIC traps", lead:"Check these before you choose.",
   body:`<ul class="ex"><li class="no">The company announced it's results.</li><li class="yes">The company announced <mark>its</mark> results. <span class="hint">it's = it is</span></li>
   <li class="no">Between you and I …</li><li class="yes">Between you and <mark>me</mark> …</li>
   <li class="no">Their going to announce the winner.</li><li class="yes"><mark>They're</mark> going to announce the winner. <span class="hint">their / there / they're</span></li>
   <li class="no">Is important to back up your files.</li><li class="yes"><mark>It</mark> is important to back up your files.</li></ul>
   <div class="tip">En español omitimos el sujeto ("Es importante", "Hay tres razones"). En inglés siempre se necesita: <b>It</b> is important, <b>There</b> are three reasons.</div>`}
  ],
  quiz:[
  ["Ms. Ortega asked ___ to prepare the slides.",["me","I","my","mine"],"After the verb <em>asked</em> → object pronoun: <b>me</b>."],
  ["Mr. Lee and ___ will attend the trade fair in Las Vegas.",["I","me","myself","mine"],"Part of the subject (before <em>will attend</em>) → <b>I</b>. Remove \"Mr. Lee and\" to check."],
  ["The company announced ___ quarterly results this morning.",["its","it's","their's","it"],"Possessive before a noun → <b>its</b>. <em>It's</em> = it is."],
  ["These files are not mine. They must be ___.",["yours","your","you","yourself"],"No noun after the blank → possessive pronoun: <b>yours</b>."],
  ["The manager ___ will interview the final candidates.",["herself","her","she's","hers"],"Emphasis (she will do it personally) → <b>herself</b>."],
  ["Please send the invoice directly to ___.",["us","we","our","ours"],"After a preposition (<em>to</em>) → object: <b>us</b>."],
  ["Mr. Park finished the report by ___ because his assistant was sick.",["himself","him","his","he"],"<em>By</em> + reflexive = alone, without help → <b>himself</b>."],
  ["The candidate ___ application impressed us most was from Puebla.",["whose","who","whom","which"],"Possession (the candidate's application) → <b>whose</b>."],
  ["The employee ___ won the award has worked here for 20 years.",["who","which","whom","whose"],"Person + subject of <em>won</em> → <b>who</b>."],
  ["The printer ___ we bought last month is already broken.",["that","who","whom","whose"],"A thing, no comma → <b>that</b> (or <em>which</em>)."],
  ["To ___ should I address the letter?",["whom","who","whose","which"],"After a preposition (<em>to</em>), for a person → <b>whom</b>."],
  ["Everyone in the department ___ invited to the dinner.",["is","are","were","have been"],"<em>Everyone</em> takes a singular verb → <b>is</b>."],
  ["Each of the participants ___ a certificate.",["receives","receive","are receiving","have received"],"<em>Each of</em> + plural noun takes a singular verb → <b>receives</b>."],
  ["Our prices are lower than ___.",["theirs","their","them","they's"],"No noun after the blank (their prices) → <b>theirs</b>."],
  ["___ is important to back up your files every day.",["It","There","They","Its"],"English needs a subject: <b>It</b> is important… (En español: \"Es importante\")."],
  ["___ are several reasons for the delay.",["There","Their","They're","It"],"To say that something exists → <b>There</b> are. (En español: \"Hay\")."],
  ["Team members should help ___ when deadlines are tight.",["each other","themselves each","theirs","them others"],"A mutual action between people → <b>each other</b>."],
  ["This laptop is too slow. I need a faster ___.",["one","it","ones","other"],"To avoid repeating a singular countable noun (<em>laptop</em>) → <b>one</b>."],
  ["We have two offices: one is in León, and ___ is in Monterrey.",["the other","another","other","others"],"The second of exactly two → <b>the other</b>."],
  ["Would you like ___ cup of coffee?",["another","other","the others","others"],"One more (singular) → <b>another</b>."],
  ["Some employees prefer working from home; ___ prefer the office.",["others","other","another","the another"],"Plural pronoun standing alone → <b>others</b>."],
  ["Between you and ___, I think the proposal is too expensive.",["me","I","myself","mine"],"After a preposition (<em>between</em>) → object: <b>me</b>. \"Between you and I\" is a common mistake."],
  ["The clients said ___ were satisfied with the service.",["they","them","their","theirs"],"Subject of <em>were</em> → <b>they</b>."],
  ["If anyone calls, tell ___ I'll be back at 3.",["them","they","their","themselves"],"Object of <em>tell</em>, for an unknown person → <b>them</b>."],
  ["Ms. Rivera introduced ___ to the new team.",["herself","her","hers","she"],"Subject and object are the same person → <b>herself</b>."],
  ["Our team worked harder than ___ did.",["they","them","their","theirs"],"Subject of <em>did</em> → <b>they</b>."],
  ["Is this ___ umbrella, Mr. Gómez?",["your","yours","you","yourself"],"Before a noun → possessive adjective: <b>your</b>."],
  ["The board approved the plan, ___ surprised everyone.",["which","who","what","that"],"After a comma, referring to a thing or idea → <b>which</b>. <em>That</em> never follows a comma."],
  ["This is the hotel ___ we stayed during the conference.",["where","which","who","whose"],"A place + full clause (<em>we stayed</em>) → <b>where</b>."],
  ["Neither of the proposals ___ acceptable.",["is","are","were","have been"],"<em>Neither of</em> takes a singular verb in formal English → <b>is</b>."],
  ["The staff will receive ___ bonuses in December.",["their","there","they're","theirs"],"Possessive before a noun → <b>their</b>."],
  ["___ going to announce the winner at noon.",["They're","Their","There","Theirs"],"<em>They are</em> going to… → <b>They're</b>."],
  ["The software updates ___ automatically every night.",["itself","it","its","it's"],"The software updates the software → reflexive: <b>itself</b>."],
  ["Please let ___ know if you need anything.",["me","I","my","myself"],"Object of <em>let</em> → <b>me</b>."],
  ["The suppliers ___ we contacted have not replied.",["whom","whose","what","which"],"People + object of <em>contacted</em> → <b>whom</b> (or <em>who/that</em>)."],
  ["Mr. Tanaka is the person to ___ you should send the forms.",["whom","who","that","which"],"After a preposition, for a person → <b>whom</b>."],
  ["Somebody left ___ jacket in the meeting room.",["their","there","they're","theirs"],"Possessive before a noun; <em>their</em> is used for an unknown person → <b>their</b>."],
  ["The two companies compete with ___ for the same customers.",["each other","themselves","theirs","them"],"A mutual action (A competes with B, B with A) → <b>each other</b>."],
  ["Ms. Kim's office is bigger than ___.",["mine","my","me","myself"],"No noun after the blank (my office) → <b>mine</b>."],
  ["All of the employees ___ completed the training.",["have","has","is","was"],"<em>All of</em> + plural noun → plural verb: <b>have</b>."],
  ["None of the information ___ correct.",["was","were","are","have been"],"<em>None of</em> + uncountable noun → singular verb: <b>was</b>."],
  ["The director wants to speak with you and ___.",["me","I","myself","mine"],"After a preposition (<em>with</em>) → object: <b>me</b>."],
  ["___ of the two candidates is qualified; we will interview both.",["Each","Every","Both","All"],"<em>Each of</em> + plural noun + singular verb (<em>is</em>). <em>Every</em> can't take <em>of</em>."],
  ["We need to hire someone ___ speaks Japanese.",["who","which","whom","whose"],"Person + subject of <em>speaks</em> → <b>who</b>."],
  ["I made a mistake, and I take full responsibility for ___.",["it","its","itself","them"],"Object of <em>for</em>, referring to <em>a mistake</em> → <b>it</b>."],
  ["The company relocated ___ headquarters to Querétaro.",["its","it's","their's","it"],"Possessive before a noun → <b>its</b>."],
  ["The CEO ___ answered all the questions from investors.",["himself","him","his","he's"],"Emphasis (personally) → <b>himself</b>."],

const LS = "toeic-suite-v1";

function saveStore(s){ try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){} }
const store = loadStore();

const S = { view: APP==="join" ? "join" : "home", topic:null, tab: APP==="study" ? "review" : "present", slide:0, quiz:null, pmode:"live", size:{topic:10, mixed:30} };

function topicBy(id){ return TOPICS.find(t=>t.id===id); }
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function qHTML(q){ return esc(q).replace("___",'<span class="blank">?</span>'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  <span class="mono crumb">${crumb}</span></header>`;
}

function renderTopic(){
  const t = topicBy(S.topic);
  document.documentElement.setAttribute("data-topic", t.key);
  const tabs = APP==="teacher" ? [["present","Present"],["practice","Practice"]] : [["review","Review"],["practice","Practice"]];

  else if(S.tab==="review") inner = reviewHTML(t);

   <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-tab-go="${k}">${l}</button>`).join("")}</div></div>` + inner;

}
function practiceHTML(){
  if(APP!=="teacher") return quizHTML();
  const modes=[["live","Live · phones"],["screen","On screen"]];
  return `<div class="pmode"><div class="tabs" role="tablist" aria-label="Practice mode">${modes.map(([k,l])=>`<button role="tab" aria-selected="${S.pmode===k}" data-pmode="${k}">${l}</button>`).join("")}</div>
  <span class="hint">${S.pmode==="live"?"Students answer on their phones with the Join app.":"Solve the questions together on the classroom screen."}</span></div>` + (S.pmode==="live" ? `<div id="live"></div>` : quizHTML());
}

function slideHTML(t,s,i,inStage){
  const kick = `<div class="kick"><span>${t.name}</span><span>${String(i+1).padStart(2,"0")} / ${String(t.slides.length).padStart(2,"0")}</span></div>`;
  if(inStage){
    if(s.cover) return `<div class="slide cover">${kick}<h2>${s.title}</h2><p class="lead">${s.lead}</p></div>`;
    return `<div class="slide">${kick}<h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:""}<div class="body">${s.body}</div></div>`;
  }
  return `<section class="rsec"><span class="kick">${String(i).padStart(2,"0")}</span><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:""}<div class="body">${s.body}</div></section>`;
}

function presentHTML(t){
  const i = S.slide, n = t.slides.length;
  return `<div class="stagewrap" id="stagewrap">
    <div class="stage" id="stage">${slideHTML(t,t.slides[i],i,true)}</div>
    <div class="stagectl">
      <button class="iconbtn" data-nav="-1" ${i===0?"disabled":""} aria-label="Previous">←</button>
      <div class="prog"><i style="width:${(i+1)/n*100}%"></i></div>
      <span class="count">${i+1} / ${n}</span>
      <button class="iconbtn" data-nav="1" ${i===n-1?"disabled":""} aria-label="Next">→</button>
      <button class="btn" data-fs>Full screen</button>
    </div>
    <span class="hint">Keyboard: ← → to move · F for full screen · when you finish, go to <b>Practice</b> and solve as a group.</span>
  </div>`;
}

function reviewHTML(t){
  const cover = t.slides[0];
  return `<div class="review">
    <p class="lead" style="margin:0;color:var(--muted);max-width:62ch">${cover.lead}</p>
    ${t.slides.slice(1).map((s,i)=>slideHTML(t,s,i+1,false)).join("")}
    <div class="cta"><div><h3>Ready to practice?</h3><p>${t.quiz.length} Part 5 questions with explanations.</p></div><button class="btn" data-tab-go="practice">Go to practice</button></div>
  </div>`;
}

function shuffleOpts(it){
  const order = shuffle([0,1,2,3]);
  return {...it, o: order.map(k=>it.o[k]), a: order.indexOf(it.a)};
}
function newQuiz(items, key, size){
  return { key, size, items: shuffle(items).slice(0,size).map(shuffleOpts), i:0, answers:[], done:false, saved:false };
}
function sizeKind(){ return S.view==="mixed" ? "mixed" : "topic"; }
function ensureQuiz(){
  const key = S.view==="mixed" ? "mixed" : S.topic;
  if(!S.quiz || S.quiz.key!==key){
    const items = key==="mixed" ? TOPICS.flatMap(t=>t.quiz.map(q=>({...q, from:t.name, tkey:t.key}))) : topicBy(key).quiz;
    S.quiz = newQuiz(items, key, S.size[sizeKind()]);
  }
}

function quizHTML(){
  ensureQuiz();
  const Q = S.quiz, total = Q.items.length;
  const opts = S.view==="mixed" ? [30,60,100] : [10,25,50];
  const sel = `<div class="qsize"><span class="mono">Round</span><div class="tabs" role="tablist">${opts.map(n=>`<button role="tab" aria-selected="${Q.size===n}" data-size="${n}">${S.view!=="mixed"&&n===opts[2]?n+" (all)":n} questions</button>`).join("")}</div></div>`;
  if(Q.done) return sel + resultHTML();
  return sel + questionHTML();
}
function questionHTML(){
  const Q = S.quiz, total = Q.items.length;
  const it = Q.items[Q.i], ans = Q.answers[Q.i];
  const answered = ans!=null;
  const sheet = Q.items.map((_,k)=>{const a=Q.answers[k]; const c=a==null?"":(a===Q.items[k].a?"ok":"no"); return `<span class="${c} ${k===Q.i?"cur":""}"></span>`;}).join("");
  return `<div class="qcard" ${it.tkey?`data-topic="${it.tkey}"`:""}>
    <div class="qtop"><span class="mono">Question ${Q.i+1} of ${total}${it.from?` · ${it.from}`:""}</span><span>Choose the best answer</span></div>
    <p class="qtext">${qHTML(it.q)}</p>
    <div class="opts">${it.o.map((o,k)=>{
      let cls=""; if(answered){ if(k===it.a) cls="right"; else if(k===ans) cls="wrong"; }
      return `<button class="opt ${cls}" data-ans="${k}" ${answered?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(o)}</span></button>`;}).join("")}</div>
    ${answered?`<div class="fb ${ans===it.a?"ok":"no"}"><strong>${ans===it.a?"Correct!":"The answer is "+L[it.a]}</strong><span>${it.why}</span></div>`:""}
    <div class="qnav"><div class="sheet" aria-hidden="true">${sheet}</div>
      ${answered?`<button class="btn solid" data-next>${Q.i===total-1?"See results":"Next →"}</button>`:`<span class="hint">Press A, B, C or D to answer</span>`}</div>
  </div>`;
}

function resultHTML(){
  const Q = S.quiz, total = Q.items.length;
  const score = Q.items.reduce((n,it,k)=>n+(Q.answers[k]===it.a?1:0),0);
  const pctNow = Math.round(score/total*100);
  const prev = store[Q.key];
  if(!Q.saved){ Q.saved=true; if(prev==null || pctNow>prev){ store[Q.key]=pctNow; saveStore(store); } }
  const pct = score/total;
  const msg = pct>=.9 ? "Excellent! You know this topic well." : pct>=.7 ? "Good work. Check the ones you missed." : "Go back to Review, then try again.";
  return `<div class="qcard" style="max-width:none">
    <div class="result"><div class="score">${score}<small>/${total}</small></div>
      <div><h2 style="font-family:var(--f-display);margin:0 0 4px">${msg}</h2><p style="margin:0;color:var(--muted)">${pctNow}% · Best score on this device: ${Math.max(pctNow,prev??0)}%</p>
      <div class="actions" style="margin-top:12px"><button class="btn solid" data-retry>Try again</button>${S.view==="mixed"?`<button class="btn" data-go="home">Back to topics</button>`:`<button class="btn" data-tab-go="review">Review the topic</button>`}</div></div></div>
    <div class="rlist">${Q.items.map((it,k)=>{const ok=Q.answers[k]===it.a; return `<div class="ritem ${ok?"ok":"no"}">${it.from?`<span class="tag" data-topic="${it.tkey}">${it.from}</span>`:""}<span class="q">${k+1}. ${esc(it.q).replace("___", "<mark>"+(it.o[it.a].startsWith("—")?"∅":esc(it.o[it.a]))+"</mark>")}</span>${ok?"":`<span class="ans">Your answer: ${L[Q.answers[k]]}) ${esc(it.o[Q.answers[k]])}</span><span>${it.why}</span>`}</div>`;}).join("")}</div>
  </div>`;
}

function renderMixed(){
  document.documentElement.removeAttribute("data-topic");
  app.innerHTML = bar() + `<div class="thead"><div><span class="mono" style="color:var(--muted)">All topics</span><h1>Mixed test</h1></div></div>` + practiceHTML();
  afterPractice();
}

function render(){
  if(APP==="join") return renderJoin();
  if(S.view==="home") renderHome();
  else if(S.view==="mixed") renderMixed();
  else renderTopic();
}

function go(view, topic, tab){
  S.view=view; S.topic=topic||null; if(tab) S.tab=tab;
  if(view==="topic"){ S.slide=0; }
  S.quiz=null;
  setHash(view==="home"?"":view==="mixed"?"mixed":topic+"-"+S.tab);
  render(); window.scrollTo(0,0);
}

app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.go==="home") return go("home");
  if(b.dataset.go==="mixed") return go("mixed");
  if(b.dataset.pmode){ S.pmode=b.dataset.pmode; render(); return; }
  if(b.dataset.copy!=null){ const t=b.dataset.copy; const done=()=>{ b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1500); };
    try{ navigator.clipboard.writeText(t).then(done,()=>selectNext(b)); }catch(err){ selectNext(b); } return; }
  if(b.dataset.open) return go("topic", b.dataset.open, b.dataset.tab);
  if(b.dataset.tabGo){ S.tab=b.dataset.tabGo; if(S.tab==="practice" && S.quiz && S.quiz.done) S.quiz=null; setHash(S.topic+"-"+S.tab); render(); window.scrollTo(0,0); return; }
  if(b.dataset.nav) return nav(+b.dataset.nav);
  if(b.hasAttribute("data-fs")) return toggleFS();
  if(b.dataset.ans!=null) return answer(+b.dataset.ans);
  if(b.hasAttribute("data-next")) return next();
  if(b.dataset.size){ S.size[sizeKind()]=+b.dataset.size; S.quiz=null; render(); return; }
  if(b.hasAttribute("data-retry")){ const k=S.quiz.key; S.quiz=null; render(); return; }
});

function selectNext(b){ const c=b.previousElementSibling; if(!c) return; const r=document.createRange(); r.selectNodeContents(c); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }
function nav(d){
  const t=topicBy(S.topic); const n=S.slide+d;
  if(n<0||n>=t.slides.length) return;
  S.slide=n;
  const stage=document.getElementById("stage");
  if(stage){ stage.innerHTML=slideHTML(t,t.slides[n],n,true);
    const w=document.getElementById("stagewrap");
    w.querySelector(".prog i").style.width=((n+1)/t.slides.length*100)+"%";
    w.querySelector(".count").textContent=`${n+1} / ${t.slides.length}`;
    w.querySelector('[data-nav="-1"]').disabled = n===0;
    w.querySelector('[data-nav="1"]').disabled = n===t.slides.length-1;
  }
}
function toggleFS(){
  const w=document.getElementById("stagewrap"); if(!w) return;
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(w.requestFullscreen) w.requestFullscreen().catch(()=>{});
  }catch(e){}
}
function answer(k){ const Q=S.quiz; if(Q.answers[Q.i]!=null) return; Q.answers[Q.i]=k; render(); }
function next(){ const Q=S.quiz; if(Q.i<Q.items.length-1) Q.i++; else Q.done=true; render(); }

document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea")) return;
  if(S.view==="topic" && S.tab==="present"){
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); nav(1); }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); nav(-1); }
    else if(e.key==="f"||e.key==="F") toggleFS();
    return;
  }
  const inQuiz = inPractice() && !(APP==="teacher" && S.pmode==="live");
  if(inQuiz && S.quiz && !S.quiz.done){
    const k=["a","b","c","d"].indexOf(e.key.toLowerCase());
    if(k>-1 && S.quiz.answers[S.quiz.i]==null) answer(k);
    else if(e.key==="Enter" && S.quiz.answers[S.quiz.i]!=null) next();
  }
});

function fromHash(){
  const h=(location.hash||"").slice(1);
  if(APP==="join") return;
  if(h==="mixed"){ S.view="mixed"; return; }
  const m=h.match(/^(conjunctions|word-order|comparisons|articles|tenses|modals|pronouns|still-yet-already|so-such-too|prepositions)(?:-(present|review|practice))?$/);
  if(m){ const ok = APP==="teacher" ? ["present","practice"] : ["review","practice"]; S.view="topic"; S.topic=m[1]; S.tab = ok.includes(m[2]) ? m[2] : ok[0]; }
}
/* ===================== LIVE MODE ===================== */
/* The Firebase config lives in toeic-firebase-config.js (shared by the teacher and join apps). */
const FIREBASE_CONFIG = window.TOEIC_FIREBASE_CONFIG || { apiKey:"PASTE_API_KEY" };
const LIVE_COLL = "toeic_live";
const FB_VER = "10.12.2";
const LIVE_N = [10,15,20], LIVE_T = [10,20,30];

function liveConfigured(){ return !!window.firebase || (FIREBASE_CONFIG.apiKey && !/^PASTE/.test(FIREBASE_CONFIG.apiKey)); }
const loadedScripts = {};
function loadScript(src){
  if(!loadedScripts[src]) loadedScripts[src] = new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{ delete loadedScripts[src]; rej(new Error("Could not load "+src)); }; document.head.appendChild(s); });
  return loadedScripts[src];
}
let dbPromise = null;
function getDB(){
  if(!dbPromise) dbPromise = (async()=>{
    if(!window.firebase){
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore-compat.js`);
    }
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    return firebase.firestore();
  })().catch(e=>{ dbPromise=null; throw e; });
  return dbPromise;
}
function ssGet(k){ try{ return JSON.parse(sessionStorage.getItem(k)); }catch(e){ return null; } }
function ssSet(k,v){ try{ v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function livePool(topicId){ return topicId==="mixed" ? TOPICS.flatMap(t=>t.quiz.map(q=>({...q, from:t.name, tkey:t.key}))) : (topicBy(topicId)||TOPICS[0]).quiz; }
function liveTopicName(topicId){ return topicId==="mixed" ? "Mixed test" : (topicBy(topicId)||{}).name || ""; }
function liveQ(sess, i){
  const q = livePool(sess.topicId)[sess.qIdx[i]];
  const order = sess.orders[i].split("").map(Number);
  return {...q, o: order.map(k=>q.o[k]), a: order.indexOf(q.a)};
}
function joinURL(code){ return sibling("toeic-join.html") + "#" + code; }
function newCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c=""; for(let i=0;i<5;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function optText(o){ return o.startsWith("—") ? o : esc(o); }
function errMsg(e){
  const m = String(e && e.message || e);
  if(/permission|insufficient/i.test(m)) return "Firestore rejected the request. Add the toeic_live rule to your Firestore security rules.";
  if(/load/i.test(m)) return "Live mode couldn't connect. Check the internet connection. Live mode only works in the version on your hosting, not inside Claude.";
  return "Something went wrong: " + m;
}

/* ---------- Host (classroom screen) ---------- */
const LH = { code:null, topicId:null, sess:null, players:[], counts:[0,0,0,0], answered:0, unsubs:[], ansUnsub:null, ansFor:-1, timer:null, revealedFor:-1, n:10, dur:10, results:null, error:"", busy:false };

function hostStop(){ LH.unsubs.forEach(u=>{ try{u();}catch(e){} }); LH.unsubs=[]; if(LH.ansUnsub){ try{LH.ansUnsub();}catch(e){} LH.ansUnsub=null; } LH.ansFor=-1; clearInterval(LH.timer); LH.timer=null; }
async function hostStart(topicId){
  LH.busy=true; LH.error=""; liveRender();
  try{
    const db = await getDB();
    let code, ref;
    for(let tries=0; tries<5; tries++){ code=newCode(); ref=db.collection(LIVE_COLL).doc(code); const s=await ref.get(); if(!s.exists) break; }
    const pool = livePool(topicId);
    const qIdx = shuffle(pool.map((_,i)=>i)).slice(0, LH.n);
    const orders = qIdx.map(()=>shuffle([0,1,2,3]).join(""));
    await ref.set({ topicId, qIdx, orders, n:qIdx.length, dur:LH.dur, cur:-1, phase:"lobby", endsAt:0, createdAt:Date.now() });
    LH.code=code; LH.topicId=topicId; LH.results=null; LH.revealedFor=-1;
    ssSet("toeic-live-host", {code, topicId});
    hostListen();
  }catch(e){ LH.error=errMsg(e); }
  LH.busy=false; liveRender();
}
async function hostListen(){
  hostStop();
  const db = await getDB();
  const ref = db.collection(LIVE_COLL).doc(LH.code);
  LH.unsubs.push(ref.onSnapshot(s=>{
    if(!s.exists){ LH.error="This session no longer exists."; LH.code=null; ssSet("toeic-live-host",null); hostStop(); liveRender(); return; }
    LH.sess = s.data();
    if(LH.sess.phase==="question" || LH.sess.phase==="reveal") hostWatchAnswers(ref, LH.sess.cur);
    if(LH.sess.phase==="question" && !LH.timer) LH.timer=setInterval(hostTick, 250);
    if(LH.sess.phase!=="question" && LH.timer){ clearInterval(LH.timer); LH.timer=null; }
    if(LH.sess.phase==="ended" && !LH.results) hostResults();
    liveRender();
  }, e=>{ LH.error=errMsg(e); liveRender(); }));
  LH.unsubs.push(ref.collection("players").onSnapshot(qs=>{
    LH.players = qs.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
    liveUpdate();
  }));
}
function hostWatchAnswers(ref, cur){
  if(LH.ansFor===cur) return;
  if(LH.ansUnsub){ try{LH.ansUnsub();}catch(e){} }
  LH.ansFor=cur; LH.counts=[0,0,0,0]; LH.answered=0;
  LH.ansUnsub = ref.collection("answers").where("q","==",cur).onSnapshot(qs=>{
    const c=[0,0,0,0]; qs.docs.forEach(d=>{ const k=d.data().choice; if(k>=0&&k<4) c[k]++; });
    LH.counts=c; LH.answered=qs.size; liveUpdate();
  });
}
function hostRemaining(){ return LH.sess ? Math.max(0, (LH.sess.endsAt - Date.now())/1000) : 0; }
function hostTick(){
  const s=LH.sess; if(!s || s.phase!=="question") return;
  const rem = hostRemaining();
  const t=document.getElementById("lv-time"); if(t) t.textContent=Math.ceil(rem);
  const ring=document.getElementById("lv-ring"); if(ring) ring.style.setProperty("--p", (rem/s.dur*100).toFixed(1));
  const all = LH.players.length>0 && LH.answered>=LH.players.length;
  if((rem<=0 || all) && LH.revealedFor!==s.cur){ LH.revealedFor=s.cur; hostUpdate({phase:"reveal"}); }
}
async function hostUpdate(data){ try{ const db=await getDB(); await db.collection(LIVE_COLL).doc(LH.code).update(data); }catch(e){ LH.error=errMsg(e); liveRender(); } }
function hostNext(){
  const s=LH.sess; if(!s) return;
  if(s.cur+1 >= s.n) return hostUpdate({phase:"ended"});
  hostUpdate({phase:"question", cur:s.cur+1, endsAt:Date.now()+s.dur*1000});
}
async function hostResults(){
  try{
    const db=await getDB(); const ref=db.collection(LIVE_COLL).doc(LH.code); const s=LH.sess;
    const [ans, pl] = await Promise.all([ref.collection("answers").get(), ref.collection("players").get()]);
    const correct = s.qIdx.map((_,i)=>liveQ(s,i).a);
    const names={}; pl.docs.forEach(d=>names[d.id]=d.data().name);
    const score={}; Object.keys(names).forEach(id=>score[id]=0);
    const perQ = s.qIdx.map(()=>({ok:0,total:0}));
    ans.docs.forEach(d=>{ const a=d.data(); if(a.q<0||a.q>=s.n) return; perQ[a.q].total++; if(a.choice===correct[a.q]){ perQ[a.q].ok++; score[a.pid]=(score[a.pid]||0)+1; } });
    const rank = Object.keys(score).map(id=>({name:names[id]||"Student", score:score[id]})).sort((a,b)=>b.score-a.score);
    const tot = perQ.reduce((n,q)=>n+q.total,0), ok = perQ.reduce((n,q)=>n+q.ok,0);
    LH.results = { rank, perQ, pct: tot? Math.round(ok/tot*100) : 0 };
  }catch(e){ LH.error=errMsg(e); }
  liveRender();
}
function hostEnd(){ hostStop(); ssSet("toeic-live-host", null); LH.code=null; LH.sess=null; LH.players=[]; LH.results=null; LH.error=""; liveRender(); }

/* ---------- Player (phone) ---------- */
const LP = { code:"", name:"", pid:null, sess:null, answers:{}, unsub:null, error:"", joining:false };
async function playerJoin(code, name){
  code=(code||"").trim().toUpperCase(); name=(name||"").trim().slice(0,24);
  if(!liveConfigured()){ LP.error="Live quizzes aren't set up yet. Tell your teacher."; return liveRender(); }
  if(code.length!==5){ LP.error="Enter the 5-character code on the screen."; return liveRender(); }
  if(!name){ LP.error="Enter your name so your teacher knows who answered."; return liveRender(); }
  LP.joining=true; LP.error=""; liveRender();
  try{
    const db=await getDB(); const ref=db.collection(LIVE_COLL).doc(code); const s=await ref.get();
    if(!s.exists){ LP.error="That code doesn't exist. Check it with your teacher."; }
    else if(s.data().phase==="ended"){ LP.error="This live quiz has already finished."; }
    else{
      const saved = ssGet("toeic-live-player");
      const pid = saved && saved.code===code ? saved.pid : Math.random().toString(36).slice(2,10);
      await ref.collection("players").doc(pid).set({name, joinedAt:Date.now()});
      Object.assign(LP, {code, name, pid, answers: saved && saved.code===code ? saved.answers||{} : {}});
      ssSet("toeic-live-player", {code, name, pid, answers:LP.answers});
      playerListen();
    }
  }catch(e){ LP.error=errMsg(e); }
  LP.joining=false; liveRender();
}
async function playerListen(){
  if(LP.unsub){ try{LP.unsub();}catch(e){} }
  const db=await getDB();
  LP.unsub = db.collection(LIVE_COLL).doc(LP.code).onSnapshot(s=>{ LP.sess = s.exists ? s.data() : null; liveRender(); }, e=>{ LP.error=errMsg(e); liveRender(); });
}
async function playerAnswer(k){
  const s=LP.sess; if(!s || s.phase!=="question" || LP.answers[s.cur]!=null) return;
  LP.answers[s.cur]=k; ssSet("toeic-live-player", {code:LP.code, name:LP.name, pid:LP.pid, answers:LP.answers}); liveRender();
  try{ const db=await getDB(); await db.collection(LIVE_COLL).doc(LP.code).collection("answers").doc(s.cur+"_"+LP.pid).set({q:s.cur, pid:LP.pid, choice:k, at:Date.now()}); }
  catch(e){ delete LP.answers[s.cur]; LP.error=errMsg(e); liveRender(); }
}
function playerScore(){ const s=LP.sess; if(!s) return 0; const upTo = s.phase==="question" ? s.cur-1 : (s.phase==="ended" ? s.n-1 : s.cur); let n=0; for(let i=0;i<=upTo;i++){ if(LP.answers[i]!=null && LP.answers[i]===liveQ(s,i).a) n++; } return n; }
function playerLeave(){ if(LP.unsub){ try{LP.unsub();}catch(e){} } ssSet("toeic-live-player", null); Object.assign(LP,{code:"",pid:null,sess:null,answers:{},error:""}); liveRender(); }

/* ---------- Rendering ---------- */
let liveKey = "";
function liveRender(){
  const el=document.getElementById("live"); if(!el) return;
  const isHost = APP==="teacher";
  const key = isHost ? ["h",liveConfigured(),LH.code,LH.sess&&LH.sess.phase,LH.sess&&LH.sess.cur,LH.error,!!LH.results,LH.n,LH.dur,LH.busy].join("|")
                     : ["p",LP.code,LP.sess&&LP.sess.phase,LP.sess&&LP.sess.cur,LP.sess&&LP.answers[LP.sess.cur],LP.error,LP.joining].join("|");
  if(key!==liveKey || !el.firstChild){
    liveKey=key; el.innerHTML = isHost ? hostHTML() : playerHTML();
    if(isHost && LH.sess && LH.sess.phase==="lobby") drawQR();

  }

}
function liveUpdate(){

  const pl=document.getElementById("lv-players"); if(pl) pl.innerHTML = LH.players.length ? LH.players.map(p=>`<span class="pchip">${esc(p.name||"Student")}</span>`).join("") : `<span class="hint">Waiting for students to join…</span>`;

}
function drawQR(){
  const box=document.getElementById("lv-qr"); if(!box || !LH.code) return;

}
function setupHTML(){

    <div class="lv-qhead"><span class="mono lv-k">Question ${s.cur+1} of ${s.n}${q.from?` · ${esc(q.from)}`:""}</span>
      <span id="lv-answered" class="hint"></span>
      ${rev?`<span class="lv-done">${hostRemaining()>0?"Everyone answered":"Time's up"}</span>`:`<div class="lv-ring" id="lv-ring" style="--p:100"><span id="lv-time">${s.dur}</span></div>`}</div>
    <p class="lv-q">${qHTML(q.q)}</p>
    <div class="lv-grid">${q.o.map((o,k)=>`<div class="lv-opt ${rev?(k===q.a?"right":"dim"):""}"><span class="bub">${L[k]}</span><span class="lv-ot">${optText(o)}</span><span class="lv-cnt" id="lv-cnt-${k}">0</span><span class="lv-bar"><i id="lv-bar-${k}"></i></span></div>`).join("")}</div>
    ${rev?`<div class="fb ok"><strong>Answer: ${L[q.a]}) ${optText(q.o[q.a])}</strong><span>${q.why}</span></div>
      <div class="lv-plhead"><span class="hint">Press Enter or → for the next question</span><button class="btn solid" data-lv="next">${s.cur+1>=s.n?"See results":"Next question →"}</button></div>`
      :`<div class="lv-plhead"><span class="hint">The answer appears when time runs out or everyone has answered.</span><button class="btn" data-lv="reveal">Show answer now</button></div>`}</div>`;
  }
  const r = LH.results;
  return `${err}<div class="lstage" id="lv-stage">${top}
  ${r?`<div class="result"><div class="score">${r.pct}<small>%</small></div><div><h2 class="lv-h" style="margin:0">Class accuracy</h2><p class="lead">${r.rank.length} ${r.rank.length===1?"student":"students"} · ${s.n} questions. ${(h=>h.length?` Review these questions: ${h.join(", ")}.`:" Every question had a correct majority.")(r.perQ.map((p,i)=>({i,v:p.total?p.ok/p.total:1})).filter(x=>x.v<.5).sort((a,b)=>a.v-b.v).slice(0,3).map(x=>"Q"+(x.i+1)))}</p></div></div>
  <ol class="lv-rank">${r.rank.slice(0,10).map(p=>`<li><span>${esc(p.name)}</span><b>${p.score} / ${s.n}</b></li>`).join("")}</ol>`:`<p class="hint">Calculating results…</p>`}
  <div class="actions"><button class="btn solid" data-lv="new">New live session</button></div></div>`;
}
function playerHTML(){
  const err = LP.error ? `<div class="fb no"><strong>Can't continue</strong><span>${esc(LP.error)}</span></div>` : "";
  const s = LP.sess;
  if(!LP.code || !s){
    const pre = (location.hash.match(/^#(?:join-)?([A-Za-z0-9]{5})$/)||[])[1] || "";
    return `<form class="lcard pl" id="lv-join" autocomplete="off"><span class="mono lv-k">Live quiz</span><h2 class="lv-h">Join your class</h2>
      ${err}<label for="lv-code">Code</label><input id="lv-code" class="lv-in mono" maxlength="5" value="${esc(pre.toUpperCase())}" placeholder="ABCDE" autocapitalize="characters">
      <label for="lv-name">Your name</label><input id="lv-name" class="lv-in" maxlength="24" placeholder="First name and last name">
      <button class="btn solid lv-big" type="submit" ${LP.joining?"disabled":""}>${LP.joining?"Joining…":"Join"}</button></form>`;
  }
  const tk = (topicBy(s.topicId)||{}).key; const el=document.getElementById("live"); if(el){ tk ? el.setAttribute("data-topic", tk) : el.removeAttribute("data-topic"); }
  const head = `<div class="pl-head"><span class="mono lv-k">${esc(LP.name)} · ${LP.code}</span><span class="mono lv-k">${playerScore()} ${playerScore()===1?"pt":"pts"}</span></div>`;
  if(s.phase==="lobby") return `<div class="lcard pl">${head}${err}<h2 class="lv-h">You're in!</h2><p class="lead">Look at the classroom screen. The first question will appear here when your teacher starts.</p><div class="pulse"></div></div>`;
  if(s.phase==="ended"){
    return `<div class="lcard pl">${head}<span class="mono lv-k">Final score</span><div class="score">${playerScore()}<small>/${s.n}</small></div>
    <p class="lead">${playerScore()/s.n>=.8?"Excellent work!":playerScore()/s.n>=.6?"Good job. Review the topic to improve.":"Keep practicing. Open the topic and use Review and Practice."}</p>
    <div class="actions"><a class="btn solid" href="toeic-study.html${s.topicId!=="mixed"?"#"+s.topicId+"-review":""}">Study this topic</a><button class="btn" data-lv="leave">Leave</button></div></div>`;
  }
  const q = liveQ(s, s.cur), mine = LP.answers[s.cur], rev = s.phase==="reveal";
  let body;
  if(rev){
    const ok = mine===q.a;
    body = `<div class="fb ${ok?"ok":"no"}"><strong>${mine==null?"No answer":ok?"Correct!":"Not this time"}</strong><span>Answer: ${L[q.a]}) ${optText(q.o[q.a])}</span><span>${q.why}</span></div><p class="hint">Wait for the next question.</p>`;
  }else if(mine!=null){
    body = `<div class="pl-sent"><span class="bub">${L[mine]}</span><div><b>Answer sent</b><p class="hint">${optText(q.o[mine])}<br>Look at the screen to see the results.</p></div></div>`;
  }else{
    body = `<div class="opts pl-opts">${q.o.map((o,k)=>`<button class="opt" data-lv-ans="${k}"><span class="bub">${L[k]}</span><span>${optText(o)}</span></button>`).join("")}</div>`;
  }
  return `<div class="lcard pl" ${q.tkey?`data-topic="${q.tkey}"`:""}>${head}${err}<span class="mono lv-k">Question ${s.cur+1} of ${s.n}</span><p class="qtext">${qHTML(q.q)}</p>${body}</div>`;
}
function renderJoin(){
  document.documentElement.removeAttribute("data-topic");
  app.innerHTML = bar() + `<div id="live" class="pl-wrap"></div>`;
  liveKey=""; liveRender();
}

/* ---------- Events ---------- */
app.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.lvN){ LH.n=+b.dataset.lvN; return liveRender(); }
  if(b.dataset.lvT){ LH.dur=+b.dataset.lvT; return liveRender(); }
  if(b.dataset.lvAns!=null) return playerAnswer(+b.dataset.lvAns);
  const a=b.dataset.lv; if(!a) return;
  if(a==="start") hostStart(S.view==="mixed" ? "mixed" : S.topic);
  else if(a==="next") hostNext();
  else if(a==="reveal"){ if(LH.sess){ LH.revealedFor=LH.sess.cur; hostUpdate({phase:"reveal"}); } }
  else if(a==="end"){ if(LH.sess && LH.sess.phase!=="ended") hostUpdate({phase:"ended"}); hostEnd(); }
  else if(a==="new") hostEnd();
  else if(a==="leave") playerLeave();
  else if(a==="fs"){ const w=document.getElementById("lv-stage"); try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(w&&w.requestFullscreen) w.requestFullscreen().catch(()=>{}); }catch(err){} }
});
app.addEventListener("submit", e=>{
  if(e.target.id!=="lv-join") return; e.preventDefault();
  playerJoin(document.getElementById("lv-code").value, document.getElementById("lv-name").value);
});
document.addEventListener("keydown", e=>{
  if(e.target.closest("input,textarea")) return;
  const host = APP==="teacher" && inPractice() && S.pmode==="live";
  if(host && LH.sess && LH.sess.phase==="reveal" && (e.key==="Enter"||e.key==="ArrowRight")){ e.preventDefault(); hostNext(); }
});
function liveResume(){
  const h = APP==="teacher" && ssGet("toeic-live-host");
  if(h && h.code && liveConfigured()){ LH.code=h.code; LH.topicId=h.topicId; hostListen().catch(e=>{ LH.error=errMsg(e); liveRender(); }); }
  const p = APP==="join" && ssGet("toeic-live-player");
  if(p && p.code && liveConfigured()){ Object.assign(LP, {code:p.code, name:p.name, pid:p.pid, answers:p.answers||{}}); playerListen().catch(e=>{ LP.error=errMsg(e); liveRender(); }); }
}

fromHash(); liveResume(); render();
</script>
