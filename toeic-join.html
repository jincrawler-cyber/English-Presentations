<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Join your teacher's live TOEIC grammar quiz from your phone.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TOEIC Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: answer-sheet motif — topic "forms" on a cool paper ground, A–D bubbles as the recurring device; one stage for class, one scroll for review */
:root{
  --paper:#F3F5F2; --sheet:#FFFFFF; --ink:#16202B; --muted:#56626F; --line:#D7DCD5; --tint:#E9EDE7;
  --t1:#0E7470; --t1-soft:#DDF0EE;
  --t2:#A8580A; --t2-soft:#F7E9D8;
  --t3:#5B44B5; --t3-soft:#E9E4F8;
  --t4:#B0335A; --t4-soft:#F8E1E8;
  --t5:#1F5FA8; --t5-soft:#DFEAF7;
  --t6:#557214; --t6-soft:#E8EFD6;
  --t7:#8C4A1C; --t7-soft:#F4E6DA;
  --t8:#B8322A; --t8-soft:#F8E0DD;
  --t9:#1F7A55; --t9-soft:#DCF0E6;
  --t10:#8B3A8B; --t10-soft:#F2E0F2;
  --ok:#1F7A3A; --ok-soft:#DFF2E4; --bad:#B3261E; --bad-soft:#F9E1DF;
  --acc:var(--t1); --acc-soft:var(--t1-soft); --qr-bg:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161C; --sheet:#182029; --ink:#E8ECEF; --muted:#9AA6B2; --line:#2B3640; --tint:#1F2832;
  --t1:#4FC3BC; --t1-soft:#123432; --t2:#F0A257; --t2-soft:#3A2814; --t3:#A893F2; --t3-soft:#2A2347; --t4:#F28AAA; --t4-soft:#3E1A26; --t5:#7FB2F0; --t5-soft:#16283F; --t6:#B3D468; --t6-soft:#26300F; --t7:#E7A877; --t7-soft:#3A2516; --t8:#F2897E; --t8-soft:#3D1A16; --t9:#6FD3A4; --t9-soft:#143327; --t10:#E39BE3; --t10-soft:#351A35;
  --ok:#5CCB7C; --ok-soft:#173322; --bad:#F2857C; --bad-soft:#3D1B19; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161C; --sheet:#182029; --ink:#E8ECEF; --muted:#9AA6B2; --line:#2B3640; --tint:#1F2832;
  --t1:#4FC3BC; --t1-soft:#123432; --t2:#F0A257; --t2-soft:#3A2814; --t3:#A893F2; --t3-soft:#2A2347; --t4:#F28AAA; --t4-soft:#3E1A26; --t5:#7FB2F0; --t5-soft:#16283F; --t6:#B3D468; --t6-soft:#26300F; --t7:#E7A877; --t7-soft:#3A2516; --t8:#F2897E; --t8-soft:#3D1A16; --t9:#6FD3A4; --t9-soft:#143327; --t10:#E39BE3; --t10-soft:#351A35;
  --ok:#5CCB7C; --ok-soft:#173322; --bad:#F2857C; --bad-soft:#3D1B19; color-scheme:dark}
[data-topic="t1"]{--acc:var(--t1);--acc-soft:var(--t1-soft)}
[data-topic="t2"]{--acc:var(--t2);--acc-soft:var(--t2-soft)}
[data-topic="t3"]{--acc:var(--t3);--acc-soft:var(--t3-soft)}
[data-topic="t4"]{--acc:var(--t4);--acc-soft:var(--t4-soft)}
[data-topic="t5"]{--acc:var(--t5);--acc-soft:var(--t5-soft)}
[data-topic="t6"]{--acc:var(--t6);--acc-soft:var(--t6-soft)}
[data-topic="t7"]{--acc:var(--t7);--acc-soft:var(--t7-soft)}
[data-topic="t8"]{--acc:var(--t8);--acc-soft:var(--t8-soft)}
[data-topic="t9"]{--acc:var(--t9);--acc-soft:var(--t9-soft)}
[data-topic="t10"]{--acc:var(--t10);--acc-soft:var(--t10-soft)}

*{box-sizing:border-box}
html,body{touch-action:pan-y}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:20px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i:nth-child(3){background:var(--ink)}
.crumb{color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:end;margin-bottom:36px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,5.6vw,4.1rem);line-height:1;letter-spacing:-.03em;margin:.2em 0 .25em;text-wrap:balance}
.hero p{color:var(--muted);max-width:56ch;margin:0}
.howto{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:10px}
.howto div{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:baseline}
.howto .mono{color:var(--acc)}
.topics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1060px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--acc)}
.tcard .mono{color:var(--acc)}
.tcard h2{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.1;margin:0;letter-spacing:-.02em}
.tcard p{margin:0;color:var(--muted);font-size:.95rem}
.tcard .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;border-top:1px dashed var(--line);padding-top:10px;margin-top:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.9rem}
.btn:hover{background:var(--tint)}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.solid:hover{opacity:.88;background:var(--ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--sheet)}
.tcard.mixed{grid-column:span 2;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tcard.mixed::before{background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t5),var(--t6),var(--t7),var(--t8),var(--t9),var(--t10))}
.tcard.mixed .mono,.tcard.mixed p,.tcard.mixed .meta{color:var(--paper);opacity:.8}
.tcard.mixed .meta{border-top-color:var(--paper)}
.tcard.mixed .btn{border-color:var(--paper);color:var(--paper)}
.tcard.mixed .btn.solid{background:var(--paper);color:var(--ink)}

/* topic header + tabs */
.thead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.thead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.02;letter-spacing:-.03em;margin:4px 0 0}
.thead .mono{color:var(--acc)}
.tabs{display:inline-flex;background:var(--tint);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* slides */
.stagewrap{background:var(--paper);display:flex;flex-direction:column;gap:12px}
.stagewrap:fullscreen{padding:2vh 3vw;justify-content:center}
.stage{container-type:inline-size;background:var(--sheet);border:1px solid var(--line);border-radius:12px;aspect-ratio:16/9;width:100%;max-width:100%;overflow:hidden;position:relative}
.stagewrap:fullscreen .stage{max-height:88vh;width:auto;margin:0 auto;aspect-ratio:16/9;height:88vh}
.slide{position:absolute;inset:0;padding:4.2cqw 5cqw 4cqw;display:flex;flex-direction:column;gap:1.6cqw;font-size:1.9cqw;line-height:1.45;overflow:auto}
.slide .kick{font-family:var(--f-mono);font-size:1.25cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);display:flex;justify-content:space-between}
.slide h2{font-family:var(--f-display);font-weight:800;font-size:3.9cqw;line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
.slide.cover h2{font-size:7.6cqw;margin-top:auto}
.slide.cover .lead{font-size:2.6cqw;max-width:40ch}
.slide .lead{color:var(--muted);margin:0;max-width:62ch}
.slide.cover .lead{color:var(--ink)}
.slide.cover::after{content:"";position:absolute;right:5cqw;top:5cqw;width:14cqw;height:14cqw;border-radius:50%;border:1.1cqw solid var(--acc);opacity:.9}
.slide .body{display:flex;flex-direction:column;gap:1.4cqw;min-height:0}

/* shared content blocks (slides scale via cqw; review uses rem fallback) */
.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:1.4em}
.col{border-top:3px solid var(--acc);padding-top:.5em}
.col b{display:block;font-family:var(--f-display);font-size:1.1em}
.col small{display:block;color:var(--muted);font-size:.82em;margin-bottom:.3em}
.ex{margin:0;padding:0;list-style:none;display:grid;gap:.35em}
.ex li{padding-left:1.4em;position:relative}
.ex li::before{content:"";position:absolute;left:.15em;top:.5em;width:.55em;height:.55em;border-radius:50%;border:2px solid var(--acc)}
.ex li.no::before{border-color:var(--bad);background:var(--bad)}
.ex li.yes::before{border-color:var(--ok);background:var(--ok)}
.ex li.no{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}
mark{background:var(--acc-soft);color:var(--ink);padding:0 .2em;border-radius:3px;font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86em}
th,td{text-align:left;padding:.42em .6em;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td:first-child{font-weight:700;color:var(--acc);white-space:nowrap}
.tip{background:var(--acc-soft);border-radius:8px;padding:.6em .9em;font-size:.9em}
.tip::before{content:"Nota en español";display:block;font-family:var(--f-mono);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:.15em}
.formula{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.chip{border:2px solid var(--acc);border-radius:999px;padding:.15em .7em;font-weight:700;font-size:.92em}
.chip.fill{background:var(--acc);color:var(--sheet)}
.arrow{color:var(--muted)}

.stagectl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{flex:1;min-width:120px;height:6px;background:var(--tint);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .25s}
.count{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--sheet);cursor:pointer;font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.hint{color:var(--muted);font-size:.82rem}

/* review */
.review{display:grid;gap:18px}
.rsec{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,3vw,28px);display:grid;gap:12px;font-size:1rem}
.rsec .kick{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.rsec h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0;letter-spacing:-.015em}
.rsec .lead{color:var(--muted);margin:0}
.rsec .body{display:grid;gap:12px}
.rsec .body > *{min-width:0}
.cta{background:var(--ink);color:var(--paper);border-radius:10px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cta h3{font-family:var(--f-display);margin:0;font-size:1.25rem}
.cta p{margin:2px 0 0;opacity:.75;font-size:.92rem}
.cta .btn{border-color:var(--paper);color:var(--paper)}
.cta .btn:hover{background:transparent;opacity:.85}

/* practice */
.qsize{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qsize .mono{color:var(--muted)}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,32px);display:grid;gap:18px;max-width:820px}
.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);flex-wrap:wrap}
.qtop .mono{color:var(--acc)}
.qtext{font-size:clamp(1.15rem,2.4vw,1.45rem);line-height:1.45;margin:0}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--ink);margin:0 .15em;text-align:center;color:var(--acc);font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;font-size:1.05rem;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.82rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.fb{border-radius:10px;padding:12px 16px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb strong{font-family:var(--f-display);font-size:1.1rem}
.fb.ok strong{color:var(--ok)}
.fb.no strong{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{display:flex;gap:6px;flex-wrap:wrap}
.sheet span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.sheet span.cur{border-color:var(--ink)}
.sheet span.ok{background:var(--ok);border-color:var(--ok)}
.sheet span.no{background:var(--bad);border-color:var(--bad)}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.score{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,9vw,5.5rem);line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.score small{font-size:.35em;color:var(--muted)}
.rlist{display:grid;gap:8px;margin-top:4px}
.ritem{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.95rem;display:grid;gap:3px}
.ritem .q{font-weight:700}
.ritem .ans{color:var(--muted)}
.ritem.no{border-left:4px solid var(--bad)}
.ritem.ok{border-left:4px solid var(--ok)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}

/* live mode */
.lcard,.lstage{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,32px);display:grid;gap:16px}
.lstage{font-size:clamp(1rem,1.4vw,1.25rem)}
.lstage:fullscreen{border-radius:0;border:0;padding:3vh 4vw;align-content:start;overflow:auto;font-size:clamp(1.1rem,1.8vw,1.6rem)}
.lv-k{color:var(--acc)}
.lv-h{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lcard .lead,.lstage .lead{color:var(--muted);margin:0;max-width:62ch}
.lv-opts{display:flex;gap:24px;flex-wrap:wrap}
.lv-opts > div{display:grid;gap:6px}
.lv-opts .mono{color:var(--muted)}
.lv-steps{margin:0;padding-left:1.2em;display:grid;gap:8px;max-width:70ch}
.lv-steps pre{background:var(--tint);border-radius:8px;padding:10px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;margin:6px 0 0}
.lv-steps code{font-family:var(--f-mono);font-size:.88em;background:var(--tint);padding:0 .3em;border-radius:4px}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lv-top b{color:var(--ink);letter-spacing:.14em}
.lv-lobby{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.lv-join{display:grid;gap:6px;min-width:0}
.lv-url{font-family:var(--f-mono);font-size:clamp(.95rem,1.8vw,1.3rem);font-weight:700;overflow-wrap:anywhere;margin-bottom:10px}
.lv-code{font-family:var(--f-mono);font-weight:700;font-size:clamp(3rem,9vw,6.5rem);line-height:1;letter-spacing:.12em;color:var(--acc)}
.lv-qr{background:var(--qr-bg);padding:12px;border-radius:12px;width:232px;height:232px;max-width:100%}
.lv-qr img,.lv-qr canvas{display:block;width:208px;height:208px}
.lv-plhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.lv-players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:var(--acc-soft);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.lv-qhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lv-qhead .lv-k{flex:1;min-width:0}
.lv-ring{--p:100;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%), var(--tint) 0);position:relative;flex:none}
.lv-ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--sheet)}
.lv-ring span{position:relative;font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.lv-done{font-family:var(--f-display);font-weight:800;color:var(--ok)}
.lv-q{font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.35;margin:0}
.lv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lv-opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px 18px;transition:opacity .3s,border-color .3s,background .3s}
.lv-opt .bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.lv-ot{min-width:0;overflow-wrap:anywhere}
.lv-cnt{font-family:var(--f-display);font-weight:800;font-size:1.4em;font-variant-numeric:tabular-nums}
.lv-bar{position:absolute;left:14px;right:14px;bottom:7px;height:6px;background:var(--tint);border-radius:999px;overflow:hidden}
.lv-bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:999px;transition:width .35s ease}
.lv-opt.right{border-color:var(--ok);background:var(--ok-soft)}

<body>
<div class="wrap" id="app"></div>

<script src="toeic-firebase-config.js"></script>
<script>
const APP = "join"; /* teacher | study | join */
const TOPICS = [
{ id:"conjunctions", key:"t1", n:"01", name:"Conjunctions & Linkers",
  blurb:"Although vs. despite, however vs. but, paired conjunctions and the punctuation that goes with each.",
  slides:[
  {cover:true, title:"Conjunctions & Linkers", lead:"Choose the connector by meaning <em>and</em> by grammar. Both have to fit the blank."},
  {title:"Two questions for every blank", lead:"Before you read the options, look at the sentence around the blank.",
   body:`<div class="cols" style="--n:2">
     <div class="col"><b>1 · What is the relationship?</b><small>Read both ideas</small>Contrast · cause · result · addition · condition · time · purpose</div>
     <div class="col"><b>2 · What comes after the blank?</b><small>Look right</small>A clause (subject + verb) · a noun or <em>-ing</em> · a new sentence</div></div>
     <ul class="ex"><li><mark>Although</mark> the flight was delayed, the team arrived on time. <span class="hint">→ contrast + clause</span></li>
     <li><mark>Despite</mark> the delay, the team arrived on time. <span class="hint">→ contrast + noun</span></li>
     <li>The flight was delayed. <mark>However</mark>, the team arrived on time. <span class="hint">→ contrast + new sentence</span></li></ul>`},
  {title:"Same meaning, different grammar", lead:"The column decides the answer when two options mean the same thing.",
   body:`<div class="tbl"><table><thead><tr><th>Meaning</th><th>+ clause (S + V)</th><th>+ noun / -ing</th><th>Between sentences</th></tr></thead><tbody>
   <tr><td>Contrast</td><td>although, even though, though, whereas, while</td><td>despite, in spite of, notwithstanding</td><td>however, nevertheless, nonetheless</td></tr>
   <tr><td>Cause</td><td>because, since, as</td><td>because of, due to, owing to</td><td>—</td></tr>
   <tr><td>Result</td><td>so (+ comma)</td><td>—</td><td>therefore, consequently, as a result</td></tr>
   <tr><td>Addition</td><td>and</td><td>in addition to, besides, along with</td><td>moreover, furthermore, in addition</td></tr>
   <tr><td>Condition</td><td>if, unless, provided that, as long as</td><td>in case of, in the event of</td><td>otherwise</td></tr>
   <tr><td>Time</td><td>when, while, once, as soon as, until</td><td>during, prior to, until, following</td><td>meanwhile, subsequently</td></tr>
   <tr><td>Purpose</td><td>so that</td><td>in order to (+ verb)</td><td>—</td></tr>
   </tbody></table></div>`},
  {title:"Coordinating conjunctions: FANBOYS", lead:"For, And, Nor, But, Or, Yet, So join two complete clauses. Use a comma before them.",
   body:`<div class="formula"><span class="chip">Clause</span><span class="arrow">,</span><span class="chip fill">but / so / yet …</span><span class="chip">Clause</span></div>
   <ul class="ex"><li>The office closed early, <mark>so</mark> staff left at 3 p.m. <span class="hint">result</span></li>
   <li>The proposal was strong, <mark>yet</mark> the board rejected it. <span class="hint">unexpected contrast</span></li>
   <li>We can ship by air, <mark>or</mark> we can use a local courier. <span class="hint">alternative</span></li>
   <li>Please arrive early <mark>so that</mark> we can start on time. <span class="hint">purpose ≠ result</span></li></ul>
   <div class="tip"><b>so</b> = por eso (resultado). <b>so that</b> = para que (propósito). En el TOEIC aparecen juntas como distractores.</div>`},
  {title:"Paired conjunctions", lead:"If you see the first half, look for its partner. They always travel together.",
   body:`<div class="tbl"><table><thead><tr><th>Pair</th><th>Example</th></tr></thead><tbody>
   <tr><td>both … and</td><td>Applicants need <mark>both</mark> a résumé <mark>and</mark> two references.</td></tr>
   <tr><td>either … or</td><td>You can pay <mark>either</mark> online <mark>or</mark> at the front desk.</td></tr>
   <tr><td>neither … nor</td><td><mark>Neither</mark> the manager <mark>nor</mark> the assistants were informed.</td></tr>
   <tr><td>not only … but also</td><td>The firm <mark>not only</mark> cut costs <mark>but also</mark> improved service.</td></tr>
   <tr><td>whether … or</td><td>We will proceed <mark>whether</mark> the client agrees <mark>or</mark> not.</td></tr>
   </tbody></table></div>
   <div class="tip">Con <b>either/or</b> y <b>neither/nor</b>, el verbo concuerda con el sujeto <b>más cercano</b>: "Neither the manager nor the assistants <u>were</u>".</div>`},
  {title:"Punctuation with transitions", lead:"However, therefore and moreover are adverbs. They cannot join two clauses with only a comma.",
   body:`<ul class="ex"><li class="yes">Prices rose; <mark>however</mark>, demand stayed high.</li>
   <li class="yes">Prices rose. <mark>However</mark>, demand stayed high.</li>
   <li class="yes">Prices rose, <mark>but</mark> demand stayed high.</li>
   <li class="no">Prices rose, however demand stayed high.</li></ul>
   <div class="tip">En Part 6, si el espacio está al inicio de una oración y va seguido de coma, casi siempre buscan un <b>transition</b> (However, Therefore, In addition…). Lee la oración anterior para saber cuál.</div>`},
  {title:"TOEIC traps", lead:"These distractors appear again and again.",
   body:`<ul class="ex"><li class="no">Despite of the rain …</li><li class="yes"><mark>Despite</mark> the rain … / <mark>In spite of</mark> the rain …</li>
   <li class="no">During the manager was away …</li><li class="yes"><mark>While</mark> the manager was away … / <mark>During</mark> the manager's absence …</li>
   <li class="no">Although the sales fell, but profits rose.</li><li class="yes"><mark>Although</mark> sales fell, profits rose.</li></ul>
   <div class="tip">"Aunque…, pero…" es natural en español, pero en inglés <b>although</b> y <b>but</b> nunca van juntos. <b>Unless</b> = if … not: "unless you call" = "si no llamas".</div>`}
  ],
  quiz:[
  {q:"___ the heavy rain, the outdoor product launch went ahead as planned.", o:["Although","Despite","However","Because"], a:1, why:"A noun follows the blank (<em>the heavy rain</em>), with no verb. Contrast + noun → <b>despite</b>. <em>Although</em> needs a subject + verb."},
  {q:"Ms. Chen will approve the budget ___ the figures are verified by accounting.", o:["once","during","despite","therefore"], a:0, why:"A clause follows (<em>the figures are verified</em>) and the meaning is time → <b>once</b> (= en cuanto). <em>During</em> and <em>despite</em> need a noun."},
  {q:"The new software is faster; ___, it requires more memory.", o:["although","however","despite","because of"], a:1, why:"Semicolon + blank + comma is the position for a transition. Contrast → <b>however</b>."},
  {q:"Applicants must submit ___ a résumé and two letters of reference.", o:["either","both","neither","whether"], a:1, why:"The partner of <em>and</em> is <b>both</b>. <em>Either</em> goes with <em>or</em>; <em>neither</em> goes with <em>nor</em>."},
  {q:"Shipments will remain on hold ___ the warehouse receives the missing parts.", o:["until","during","because of","so that"], a:0, why:"A clause follows, and the idea is a time limit: on hold up to the moment the parts arrive → <b>until</b>."},
  {q:"___ the conference room was already booked, the team met in the cafeteria.", o:["Due to","Since","In spite of","Moreover"], a:1, why:"Full clause + cause → <b>since</b> (= because). <em>Due to</em> needs a noun; <em>in spite of</em> shows contrast."},
  {q:"Neither the manager nor the assistants ___ aware of the schedule change.", o:["was","were","is","being"], a:1, why:"With <em>neither … nor</em>, the verb agrees with the nearer subject: <em>the assistants</em> (plural) → <b>were</b>."},
  {q:"The firm not only reduced its costs ___ improved customer satisfaction.", o:["and also","but also","or","as well"], a:1, why:"<em>Not only</em> always pairs with <b>but also</b>."},
  {q:"Please arrive fifteen minutes early ___ we can begin the training on time.", o:["so that","even though","in case of","whereas"], a:0, why:"The second part gives a purpose → <b>so that</b> (= para que)."},
  {q:"Sales rose sharply in Europe, ___ they fell slightly in Asia.", o:["whereas","despite","because","therefore"], a:0, why:"Two clauses in direct contrast → <b>whereas</b>. <em>Therefore</em> can't join clauses with a comma, and <em>despite</em> needs a noun."}
  ]},

{ id:"word-order", key:"t2", n:"02", name:"Word Order",
  blurb:"Sentence order, where adverbs go, adjective order, indirect questions and formal inversion.",
  slides:[
  {cover:true, title:"Word Order", lead:"In Part 5, the position of the blank often tells you the answer before you read the options."},
  {title:"The basic English sentence", lead:"English keeps a fixed order. The object stays next to the verb.",
   body:`<div class="formula"><span class="chip fill">Subject</span><span class="chip fill">Verb</span><span class="chip fill">Object</span><span class="chip">How</span><span class="chip">Where</span><span class="chip">When</span></div>
   <ul class="ex"><li class="yes">The team presented the results <mark>clearly</mark> <mark>in the boardroom</mark> <mark>yesterday</mark>.</li>
   <li class="no">The team presented clearly the results yesterday.</li>
   <li class="no">I like very much this proposal.</li><li class="yes">I like this proposal very much.</li></ul>
   <div class="tip">En español podemos decir "presentó claramente los resultados". En inglés el adverbio <b>no</b> se mete entre el verbo y su objeto.</div>`},
  {title:"Read the slot, choose the form", lead:"Look at the words on each side of the blank. The slot decides noun, adjective or adverb.",
   body:`<div class="tbl"><table><thead><tr><th>Slot</th><th>You need</th><th>Example</th></tr></thead><tbody>
   <tr><td>the / a / our + ___ + noun</td><td>adjective</td><td>the <mark>annual</mark> report</td></tr>
   <tr><td>the / a / our + ___ (+ verb)</td><td>noun</td><td>Our <mark>expansion</mark> was approved.</td></tr>
   <tr><td>be / seem / become + ___</td><td>adjective</td><td>The plan seems <mark>reasonable</mark>.</td></tr>
   <tr><td>verb (+ object) + ___</td><td>adverb</td><td>She reviewed it <mark>carefully</mark>.</td></tr>
   <tr><td>be / have + ___ + participle</td><td>adverb</td><td>It was <mark>carefully</mark> reviewed.</td></tr>
   <tr><td>___ + adjective</td><td>adverb</td><td><mark>highly</mark> qualified staff</td></tr>
   </tbody></table></div>`},
  {title:"Where frequency adverbs go", lead:"Always, usually, often, rarely, never …",
   body:`<div class="cols"><div class="col"><b>Before the main verb</b><small>simple tenses</small>She <mark>usually</mark> arrives at 8.</div>
   <div class="col"><b>After <em>be</em></b><small>am / is / are / was</small>He is <mark>rarely</mark> late.</div>
   <div class="col"><b>After the first auxiliary</b><small>have / will / can …</small>We have <mark>always</mark> used this vendor.</div></div>
   <ul class="ex"><li class="no">She arrives usually at 8.</li><li class="no">We always have used this vendor.</li></ul>
   <div class="tip"><b>Usually</b>, <b>sometimes</b> y <b>often</b> también pueden ir al inicio de la oración para dar énfasis.</div>`},
  {title:"Adjectives and compound nouns", lead:"Several adjectives follow a fixed order. In compound nouns, the first noun works like an adjective.",
   body:`<div class="formula"><span class="chip">opinion</span><span class="chip">size</span><span class="chip">age</span><span class="chip">shape</span><span class="chip">color</span><span class="chip">origin</span><span class="chip">material</span><span class="chip">purpose</span><span class="chip fill">NOUN</span></div>
   <ul class="ex"><li>a <mark>spacious new</mark> conference room</li><li>a <mark>large black leather</mark> sofa</li>
   <li class="yes">a <mark>three-day</mark> workshop · <mark>expense</mark> reports · the <mark>customer service</mark> desk</li>
   <li class="no">a three-days workshop</li></ul>
   <div class="tip">El primer sustantivo de un compuesto se queda en <b>singular</b>: "a ten-minute break", nunca "ten-minutes".</div>`},
  {title:"Indirect questions", lead:"After Could you tell me / Do you know / I wonder, use statement order. No do, does or did.",
   body:`<div class="tbl"><table><thead><tr><th>Direct</th><th>Indirect</th></tr></thead><tbody>
   <tr><td>Where is the meeting?</td><td>Could you tell me where <mark>the meeting is</mark>?</td></tr>
   <tr><td>When does the shuttle leave?</td><td>Do you know when <mark>the shuttle leaves</mark>?</td></tr>
   <tr><td>Did the order ship?</td><td>I wonder <mark>whether / if</mark> the order shipped.</td></tr>
   </tbody></table></div>
   <div class="tip">Si no hay palabra interrogativa (yes/no question), se agrega <b>whether</b> o <b>if</b>.</div>`},
  {title:"Formal inversion and enough", lead:"Business English uses inversion after negative adverbs and in formal conditionals.",
   body:`<ul class="ex"><li><mark>Rarely have we</mark> seen such strong growth.</li>
   <li><mark>Not only did</mark> sales increase, but costs also fell.</li>
   <li><mark>Should you</mark> need assistance, call the front desk. <span class="hint">= If you need</span></li>
   <li><mark>Had we</mark> known, we would have called. <span class="hint">= If we had known</span></li></ul>
   <div class="cols" style="--n:2"><div class="col"><b>adjective + enough</b>The room is <mark>large enough</mark>.</div>
   <div class="col"><b>enough + noun</b>We have <mark>enough chairs</mark>.</div></div>`}
  ],
  quiz:[
  {q:"The marketing team ___ meets on Mondays to review weekly results.", o:["usual","usually","usualness","more usual"], a:1, why:"Between the subject and the main verb you need a frequency adverb → <b>usually</b>."},
  {q:"Could you tell me when ___?", o:["does the shuttle leave","the shuttle leaves","leaves the shuttle","is the shuttle leave"], a:1, why:"Indirect question: statement order (subject + verb), no <em>does</em> → <b>the shuttle leaves</b>."},
  {q:"Ms. Patel gave a ___ presentation to the board of directors.", o:["persuade","persuasively","persuasive","persuasion"], a:2, why:"Article + ___ + noun (<em>presentation</em>) → adjective: <b>persuasive</b>."},
  {q:"The proposal was ___ reviewed by the legal department.", o:["careful","carefully","care","carefulness"], a:1, why:"Between <em>was</em> and the participle <em>reviewed</em> → adverb: <b>carefully</b>."},
  {q:"Rarely ___ such strong quarterly growth.", o:["the company has reported","has the company reported","the company reported","reported the company"], a:1, why:"A negative adverb at the start (<em>Rarely</em>) causes inversion: auxiliary + subject → <b>has the company reported</b>."},
  {q:"___ you require further assistance, please contact the front desk.", o:["Should","Would","Unless","Had"], a:0, why:"<b>Should</b> + subject + base verb = <em>If you require</em>. Common in formal notices and emails."},
  {q:"The training room is not ___ for forty participants.", o:["enough large","large enough","enough largely","largely enough"], a:1, why:"With adjectives, <em>enough</em> comes after → <b>large enough</b>."},
  {q:"We purchased ___ for the reception area.", o:["a leather black large sofa","a large black leather sofa","a black large leather sofa","a leather large black sofa"], a:1, why:"Adjective order: size → color → material → noun: <b>a large black leather sofa</b>."},
  {q:"The director asked us ___ the quarterly report was finished.", o:["whether","that whether","did","was"], a:0, why:"It's an indirect yes/no question, so it starts with <b>whether</b> (or <em>if</em>) and keeps statement order."},
  {q:"All staff must attend a ___ workshop on the new software.", o:["two-days","two-day","two day's","days-two"], a:1, why:"In a compound adjective, the noun stays singular and takes a hyphen → <b>two-day</b>."}
  ]},

{ id:"comparisons", key:"t3", n:"03", name:"Comparisons",
  blurb:"Comparative and superlative forms, as … as, modifiers like significantly, and the more … the more.",
  slides:[
  {cover:true, title:"Comparisons", lead:"Count the syllables, find <em>than</em> or <em>the</em>, then check the word in front."},
  {title:"Forms", lead:"Length of the adjective decides -er / -est or more / most.",
   body:`<div class="tbl"><table><thead><tr><th>Adjective</th><th>Base</th><th>Comparative</th><th>Superlative</th></tr></thead><tbody>
   <tr><td>1 syllable</td><td>cheap</td><td>cheap<mark>er</mark></td><td>the cheap<mark>est</mark></td></tr>
   <tr><td>2 syllables, ends in -y</td><td>busy</td><td>bus<mark>ier</mark></td><td>the bus<mark>iest</mark></td></tr>
   <tr><td>2+ syllables</td><td>efficient</td><td><mark>more</mark> efficient</td><td>the <mark>most</mark> efficient</td></tr>
   <tr><td>Adverb in -ly</td><td>quickly</td><td><mark>more</mark> quickly</td><td>the <mark>most</mark> quickly</td></tr>
   <tr><td>Irregular</td><td>good / well · bad · far · little · many/much</td><td>better · worse · farther/further · less · more</td><td>best · worst · farthest/furthest · least · most</td></tr>
   </tbody></table></div>`},
  {title:"Signal words", lead:"The words around the blank tell you which form the sentence needs.",
   body:`<div class="cols"><div class="col"><b>than</b><small>→ comparative</small>Profits are <mark>higher than</mark> last year's.</div>
   <div class="col"><b>the … in / of / ever</b><small>→ superlative</small>It's <mark>the largest</mark> hotel in the city.</div>
   <div class="col"><b>as … as</b><small>→ base form</small>It arrived <mark>as quickly as</mark> the first one.</div></div>
   <ul class="ex"><li>Our fees are <mark>the same as</mark> theirs. · Model B is <mark>similar to</mark> Model A. · The plan is <mark>different from</mark> last year's.</li>
   <li>Shipping is <mark>not as fast as</mark> we expected.</li></ul>`},
  {title:"Modifiers", lead:"Use these words in front of a comparative or superlative. Very and too don't work here.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>+ comparative</b><small>much, far, significantly, considerably, slightly, a little, even</small><ul class="ex"><li>The new model is <mark>significantly</mark> more efficient.</li><li>Costs were <mark>slightly</mark> lower.</li><li class="no">very cheaper</li></ul></div>
   <div class="col"><b>+ superlative</b><small>by far, one of the … + plural noun</small><ul class="ex"><li>It is <mark>by far</mark> the best option.</li><li>It's <mark>one of the most popular products</mark>.</li><li class="no">one of the most popular product</li></ul></div></div>`},
  {title:"The more …, the more …", lead:"Two comparatives, each with <em>the</em>, show that one change causes another.",
   body:`<div class="formula"><span class="chip fill">The + comparative</span><span class="chip">clause</span><span class="arrow">,</span><span class="chip fill">the + comparative</span><span class="chip">clause</span></div>
   <ul class="ex"><li><mark>The sooner</mark> we sign the contract, <mark>the faster</mark> production can begin.</li>
   <li><mark>The more</mark> customers we survey, <mark>the more accurate</mark> the results will be.</li>
   <li><mark>The larger</mark> the order, <mark>the lower</mark> the unit price.</li></ul>
   <div class="tip">Equivale a "entre más …, más …". No olvides el <b>the</b> en ambas partes.</div>`},
  {title:"Adjective or adverb? Fewer or less?", lead:"Comparisons follow the same slot rules as any other word.",
   body:`<div class="cols" style="--n:2"><div class="col"><b>be + adjective</b>The new system <mark>is faster</mark>.</div>
   <div class="col"><b>verb + adverb</b>Mr. Díaz negotiated <mark>more skillfully</mark> than his colleagues.</div>
   <div class="col"><b>fewer + countable</b><mark>fewer</mark> errors, <mark>fewer</mark> complaints</div>
   <div class="col"><b>less + uncountable</b><mark>less</mark> time, <mark>less</mark> paperwork</div></div>`},
  {title:"TOEIC traps", lead:"Check these before you choose.",
   body:`<ul class="ex"><li class="no">more cheaper</li><li class="yes"><mark>cheaper</mark></li>
   <li class="no">as fast than</li><li class="yes"><mark>as</mark> fast <mark>as</mark> / fast<mark>er than</mark></li>
   <li class="no">Our prices are lower than our competitors.</li><li class="yes">Our prices are lower than <mark>those of</mark> our competitors.</li>
   <li class="yes">faster than <mark>any other company</mark> <span class="hint">singular noun</span></li></ul>
   <div class="tip">"Más mejor" no existe en inglés: <b>better</b> ya es comparativo. Y cuidado con <b>then</b> (después) vs <b>than</b> (que, en comparaciones).</div>`}
  ],
  quiz:[
  {q:"This year's profits are ___ than last year's.", o:["high","higher","highest","more high"], a:1, why:"<em>Than</em> → comparative. <em>High</em> has one syllable → <b>higher</b>."},
  {q:"The Riverside is ___ hotel in the city.", o:["larger","the largest","largest","more large"], a:1, why:"<em>In the city</em> signals a superlative, and superlatives need <em>the</em> → <b>the largest</b>."},
