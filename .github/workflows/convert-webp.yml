name: Convertir JPG a WebP
on:
  push:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para que la acción pueda subir los archivos .webp
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar WebP
        run: sudo apt-get install -y webp

      - name: Convertir imágenes
        run: |
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" \) | while read file; do
            # Crea el nombre del nuevo archivo .webp
            webp_file="${file%.*}.webp"
            # Convierte si el .webp no existe
            if [ ! -f "$webp_file" ]; then
              echo "Convirtiendo: $file"
              cwebp -q 80 "$file" -o "$webp_file"
            fi
          done

      - name: Subir cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-convertir imágenes a WebP"
          file_pattern: '**.webp'
